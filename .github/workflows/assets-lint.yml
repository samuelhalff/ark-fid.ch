name: Assets Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Audit image usage
        run: node scripts/audit-image-usage.js > image-usage.csv
      - name: Check assets
        env:
          ASSET_MAX_BYTES: 600000
        run: node scripts/check-assets.js
