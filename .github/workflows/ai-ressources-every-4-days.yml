name: AI Resources Update (every 3 days)

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:
    inputs:
      force_topic:
        description: "Override topic selection (e.g., comptabilite crypto)"
        required: false
        type: string
      force_topic_keywords:
        description: "Optional comma-separated SEO keywords"
        required: false
        type: string
      force_topic_category:
        description: "Optional category override (accounting, tax, payroll, etc.)"
        required: false
        type: string
      skip_topic_rotation:
        description: "Skip topic rotation guardrails"
        required: false
        type: boolean

concurrency:
  group: ai-content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Capture existing article slugs
        run: |
          python3 - <<'PY'
          import json
          with open('src/translations/fr/ressources.json') as f:
              data = json.load(f)
          slugs = [a['slug'] for a in data.get('Articles', []) if a.get('slug')]
          with open('/tmp/existing-slugs.txt', 'w') as f:
              f.write('\n'.join(slugs))
          print(f"Captured {len(slugs)} existing article slugs")
          PY

      - name: Run AI update (FR + translations via Azure OpenAI)
        env:
          AZURE_AGENT_ENDPOINT: ${{ secrets.AZURE_AGENT_ENDPOINT }}
          AZURE_AGENT_NAME: ${{ vars.AZURE_AGENT_NAME || 'web-deep-search:6' }}
          AZURE_AGENT_API_KEY: ${{ secrets.AZURE_AGENT_API_KEY }}
          AZURE_AGENT_FORCE_RESPONSES: "1"
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT || 'https://pbmch8303697696.cognitiveservices.azure.com/' }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: "2025-01-01-preview"
          AZURE_OPENAI_DEPLOYMENT: "gpt-4.1"
          AZURE_OPENAI_DRAFT_DEPLOYMENT: "gpt-5.2"
          AZURE_OPENAI_DRAFT_API_VERSION: "2025-01-01-preview"
          AZURE_OPENAI_RESEARCH_ENDPOINT: ${{ secrets.AZURE_OPENAI_RESEARCH_ENDPOINT }}
          AZURE_OPENAI_RESEARCH_API_KEY: ${{ secrets.AZURE_OPENAI_RESEARCH_API_KEY }}
          AZURE_OPENAI_RESEARCH_API_VERSION: ${{ vars.AZURE_OPENAI_RESEARCH_API_VERSION || '2024-05-01-preview' }}
          AZURE_OPENAI_RESEARCH_DEPLOYMENT: ${{ vars.AZURE_OPENAI_RESEARCH_DEPLOYMENT }}
          AZURE_OPENAI_DRAFT_MAX_TOKENS: "8192"
          AZURE_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          AZURE_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          AZURE_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          AZURE_AGENT_RUN_TIMEOUT_MS: 180000
          AZURE_AGENT_RESPONSES_RETRIES: "8"
          AZURE_AGENT_RESPONSES_BACKOFF_MS: "30000"
          AZURE_AGENT_RESPONSES_BACKOFF_MAX_MS: "300000"
          AZURE_AGENT_RESPONSES_BACKOFF_JITTER_MS: "2000"
          AZURE_AGENT_RESPONSES_TIMEOUT_MS: "180000"
          AZURE_AGENT_RESPONSES_COOLDOWN_MS: "15000"
          AZURE_AGENT_RESPONSES_MAX_OUTPUT_TOKENS: "0"
          AZURE_AGENT_FALLBACK_TO_OPENAI: "1"
          REQUIRE_TRANSLATIONS: "1"
          AI_TWO_STEP: "1"
          AI_RESEARCH_RETRIES: "3"
          FORCE_TOPIC: ${{ inputs.force_topic }}
          FORCE_TOPIC_KEYWORDS: ${{ inputs.force_topic_keywords }}
          FORCE_TOPIC_CATEGORY: ${{ inputs.force_topic_category }}
          SKIP_TOPIC_ROTATION: ${{ inputs.skip_topic_rotation == 'true' && '1' || '' }}
          TRENDS_PROVIDER: ${{ vars.TRENDS_PROVIDER || 'hybrid' }}
          TRENDS_GEO: ${{ vars.TRENDS_GEO }}
          TRENDS_LANGUAGE: ${{ vars.TRENDS_LANGUAGE }}
          TRENDS_MAX_TOPICS: ${{ vars.TRENDS_MAX_TOPICS }}
          REFERENCE_MIN_TRUSTED_DOMAINS: "1"
          REFERENCE_MIN_COUNT: "4"
          REFERENCE_MAX_COUNT: "6"
          SEO_MIN_WORDS: "1500"
          SEO_MAX_WORDS: "4000"
        run: |
          node scripts/ai-ressources-update.js --apply --translate-existing

      - name: Fix malformed internal markdown links
        run: node scripts/fix-article-internal-links.js --apply

      - name: Validate latest article guardrails
        run: node scripts/validate-latest-article-guardrails.js

      - name: Detect new article for LinkedIn notification
        id: detect-article
        run: |
          python3 - <<'PY'
          import json, os, sys
          try:
              with open('/tmp/existing-slugs.txt') as f:
                  existing = set(line for line in f.read().strip().split('\n') if line)
          except FileNotFoundError:
              existing = set()
          with open('src/translations/fr/ressources.json') as f:
              data = json.load(f)
          new_ones = [a for a in data.get('Articles', []) if a.get('slug') and a['slug'] not in existing]
          if not new_ones:
              print("No new articles detected")
              sys.exit(0)
          if len(new_ones) > 1:
              print(f"Detected {len(new_ones)} new articles; notifying about the first one only")
          a = new_ones[0]
          output_file = os.environ.get('GITHUB_OUTPUT', '')
          if output_file:
              delim = 'ENDOFVALUE'
              with open(output_file, 'a') as f:
                  f.write('has_new=true\n')
                  f.write(f'slug={a["slug"]}\n')
                  f.write(f'title<<{delim}\n{a.get("title","")[:400]}\n{delim}\n')
                  f.write(f'description<<{delim}\n{a.get("description","")[:4086]}\n{delim}\n')
          print(f"Detected new article: {a.get('title','')[:80]}")
          PY

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "src/translations/**/*.json" || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ressources): AI article update" --author="samuelhalff <660062+samuelhalff@users.noreply.github.com>"
            sleep 15
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            git push
          fi

      - name: Ping sitemaps
        continue-on-error: true
        run: node scripts/ping-sitemaps.js

      - name: Notify Zapier webhook (LinkedIn publication)
        if: steps.detect-article.outputs.has_new == 'true'
        continue-on-error: true
        env:
          ARTICLE_TITLE: ${{ steps.detect-article.outputs.title }}
          ARTICLE_SLUG: ${{ steps.detect-article.outputs.slug }}
          ARTICLE_DESCRIPTION: ${{ steps.detect-article.outputs.description }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          title = os.environ.get('ARTICLE_TITLE', '')
          slug = os.environ.get('ARTICLE_SLUG', '')
          description = os.environ.get('ARTICLE_DESCRIPTION', '')
          unsplash_key = os.environ.get('UNSPLASH_ACCESS_KEY', '')
          article_url = f"https://ark-fid.ch/fr/ressources/articles/{slug}/"

          image_url = ''
          if unsplash_key:
              try:
                  req = urllib.request.Request(
                      'https://api.unsplash.com/photos/random?query=Switzerland+landscape&orientation=landscape',
                      headers={'Authorization': f'Client-ID {unsplash_key}', 'Accept-Version': 'v1'},
                  )
                  with urllib.request.urlopen(req, timeout=15) as r:
                      image_url = json.loads(r.read().decode('utf-8')).get('urls', {}).get('regular', '')
              except Exception as e:
                  print(f"⚠️ Unsplash error: {e}")

          if len(description) > 200:
              truncated = description[:200].rsplit(' ', 1)[0]
              last_end = max(truncated.rfind('.'), truncated.rfind('!'), truncated.rfind('?'))
              summary = truncated[:last_end + 1] if last_end > 0 else truncated + '…'
          else:
              summary = description
          if summary:
              sep = ' ' if summary[-1:] in '.!?' else '. '
              comment = f"{summary}{sep}Découvrez l'article complet sur Ark Fiduciaire →"
          else:
              comment = f"Découvrez notre dernier article : {title} →"

          payload = json.dumps({
              "title": title, "url": article_url, "description": description,
              "image_url": image_url, "comment": comment,
          }).encode('utf-8')
          req = urllib.request.Request(
              'https://hooks.zapier.com/hooks/catch/3870740/u06k73r/',
              data=payload, headers={'Content-Type': 'application/json'}, method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"✅ Zapier webhook sent (status: {resp.status})")
          except Exception as e:
              print(f"⚠️ Zapier webhook error: {e}")
          PY
