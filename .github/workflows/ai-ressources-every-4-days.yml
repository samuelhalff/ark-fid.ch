name: AI Resources Update (every 4 days)

on:
  schedule:
    - cron: "0 0 */4 * *" # every 4 days at 00:00 UTC
  workflow_dispatch:

concurrency:
  group: ai-content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use PAT to allow commits to trigger other workflows
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Preflight - Validate required environment variables
        env:
          AZURE_AGENT_ENDPOINT: ${{ secrets.AZURE_AGENT_ENDPOINT }}
          AZURE_AGENT_NAME: ${{ secrets.AZURE_AGENT_NAME }}
          # Azure OpenAI endpoint isn't sensitive; prefer a known-good default.
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT || 'https://pbmch8303697696.cognitiveservices.azure.com/' }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          # Use a known-good Azure OpenAI api-version (GitHub secret values have caused 404s).
          AZURE_OPENAI_API_VERSION: "2024-05-01-preview"
          AZURE_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          AZURE_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          AZURE_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          TRENDS_PROVIDER: ${{ vars.TRENDS_PROVIDER || 'hybrid' }}
          TRENDS_GEO: ${{ vars.TRENDS_GEO }}
          TRENDS_LANGUAGE: ${{ vars.TRENDS_LANGUAGE }}
          TRENDS_MAX_TOPICS: ${{ vars.TRENDS_MAX_TOPICS }}
        run: |
          echo "🔍 Validating required environment variables..."

          # Check required Azure vars
          if [ -n "$AZURE_AGENT_ENDPOINT" ]; then
            echo "✅ AZURE_AGENT_ENDPOINT: set (length: ${#AZURE_AGENT_ENDPOINT})"
          else
            echo "❌ AZURE_AGENT_ENDPOINT: missing"
            exit 1
          fi

          if [ -n "$AZURE_AGENT_NAME" ]; then
            echo "✅ AZURE_AGENT_NAME: set (length: ${#AZURE_AGENT_NAME})"
          else
            echo "❌ AZURE_AGENT_NAME: missing"
            exit 1
          fi

          if [ -n "$AZURE_OPENAI_ENDPOINT" ]; then
            echo "✅ AZURE_OPENAI_ENDPOINT: set (length: ${#AZURE_OPENAI_ENDPOINT})"
          else
            echo "❌ AZURE_OPENAI_ENDPOINT: missing"
            exit 1
          fi

          if [ -n "$AZURE_OPENAI_API_KEY" ]; then
            echo "✅ AZURE_OPENAI_API_KEY: set (length: ${#AZURE_OPENAI_API_KEY})"
          else
            echo "❌ AZURE_OPENAI_API_KEY: missing"
            exit 1
          fi

          if [ -n "$AZURE_TENANT_ID" ]; then
            echo "✅ AZURE_TENANT_ID: set (length: ${#AZURE_TENANT_ID})"
          else
            echo "❌ AZURE_TENANT_ID: missing"
            exit 1
          fi

          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "✅ AZURE_CLIENT_ID: set (length: ${#AZURE_CLIENT_ID})"
          else
            echo "❌ AZURE_CLIENT_ID: missing"
            exit 1
          fi

          if [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "✅ AZURE_CLIENT_SECRET: set (length: ${#AZURE_CLIENT_SECRET})"
          else
            echo "❌ AZURE_CLIENT_SECRET: missing"
            exit 1
          fi

          # Check optional trend configuration (from vars, not secrets)
          echo ""
          echo "📊 Trend configuration (from repository variables):"
          echo "  TRENDS_PROVIDER: ${TRENDS_PROVIDER:-'(not set, default: hybrid)'}"
          echo "  TRENDS_GEO: ${TRENDS_GEO:-'(not set, default: CH)'}"
          echo "  TRENDS_LANGUAGE: ${TRENDS_LANGUAGE:-'(not set, default: fr)'}"
          echo "  TRENDS_MAX_TOPICS: ${TRENDS_MAX_TOPICS:-'(not set, default: 10)'}"

          echo ""
          echo "✅ All required environment variables validated"

      - name: Run AI update (FR + translations via Azure OpenAI)
        env:
          AZURE_AGENT_ENDPOINT: ${{ secrets.AZURE_AGENT_ENDPOINT }}
          AZURE_AGENT_NAME: ${{ secrets.AZURE_AGENT_NAME }}
          # Foundry agent name-only mode (prevents accidental fallback to classic assistants).
          AZURE_AGENT_FORCE_RESPONSES: "1"
          # Azure OpenAI endpoint isn't sensitive; prefer a known-good default.
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT || 'https://pbmch8303697696.cognitiveservices.azure.com/' }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          # Use a known-good Azure OpenAI api-version (GitHub secret values have caused 404s).
          AZURE_OPENAI_API_VERSION: "2024-05-01-preview"
          # Keep translations on GPT-4.1, even if endpoint secret includes another deployment path.
          AZURE_OPENAI_DEPLOYMENT: "gpt-4.1"
          # Use a faster/higher-quality writer model for long-form drafting.
          AZURE_OPENAI_DRAFT_DEPLOYMENT: "gpt-4o"
          # Allow enough output tokens for 1500–3000 word drafts.
          AZURE_OPENAI_DRAFT_MAX_TOKENS: "6144"
          AZURE_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          AZURE_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          AZURE_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          # Adjust if longer draft generations are needed
          AZURE_AGENT_RUN_TIMEOUT_MS: 180000
          # Responses API throttling guardrails
          AZURE_AGENT_RESPONSES_RETRIES: "8"
          AZURE_AGENT_RESPONSES_BACKOFF_MS: "30000"
          AZURE_AGENT_RESPONSES_BACKOFF_MAX_MS: "300000"
          AZURE_AGENT_RESPONSES_BACKOFF_JITTER_MS: "2000"
          AZURE_AGENT_RESPONSES_TIMEOUT_MS: "180000"
          AZURE_AGENT_RESPONSES_COOLDOWN_MS: "15000"
          # Leave uncapped to avoid incomplete JSON output
          AZURE_AGENT_RESPONSES_MAX_OUTPUT_TOKENS: "0"
          REQUIRE_TRANSLATIONS: "1"
          # Two-step workflow: agent does research+refs, model drafts the article.
          AI_TWO_STEP: "1"
          AI_RESEARCH_RETRIES: "3"
          # Trend provider configuration (from repository variables)
          TRENDS_PROVIDER: ${{ vars.TRENDS_PROVIDER || 'hybrid' }}
          TRENDS_GEO: ${{ vars.TRENDS_GEO }}
          TRENDS_LANGUAGE: ${{ vars.TRENDS_LANGUAGE }}
          TRENDS_MAX_TOPICS: ${{ vars.TRENDS_MAX_TOPICS }}
          # Reference quality guardrails
          # Allow broader sources, but keep at least one official source
          REFERENCE_REQUIRE_TRUSTED_DOMAINS: "0"
          REFERENCE_MIN_TRUSTED_DOMAINS: "1"
          REFERENCE_MIN_COUNT: "4"
          REFERENCE_MAX_COUNT: "6"
          # Enforce minimum article length (SEO)
          SEO_MIN_WORDS: "1500"
          SEO_MAX_WORDS: "3000"
        run: |
          node scripts/ai-ressources-update.js --apply --translate-existing

      - name: Fix malformed internal markdown links
        run: node scripts/fix-article-internal-links.js --apply

      - name: Validate article translations (fail on missing/duplicates)
        env:
          REQUIRE_TRANSLATIONS: "1"
        run: node scripts/validate-article-translations.js

      - name: Clean up bad article references (unreachable URLs)
        continue-on-error: true
        run: |
          echo "🧹 Removing unreachable article reference links..."
          node scripts/clean-bad-article-refs.js --all-locales || echo "⚠️ Reference cleanup had issues (continuing...)"

      - name: Final verification (informational only)
        continue-on-error: true
        run: |
          echo "✅ Running final verification..."
          node scripts/check-ressources-links.js --all-locales || echo "::warning::Some references missing after cleanup"
          node scripts/check-ressources-links.js --all-locales --remote || echo "::warning::Some URLs still unreachable after cleanup"
          echo "✅ Verification complete. Proceeding with deployment..."

      - name: Validate article references (fail on 404/410)
        run: npm run validate:article-refs

      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/translations/**/ressources.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ressources): every 4 days AI article update" --author="samuelhalff <660062+samuelhalff@users.noreply.github.com>"
            echo "⏳ Waiting 30 seconds before push to avoid deployment conflicts..."
            sleep 30
            echo "🔄 Rebasing on latest origin/main to avoid non-fast-forward pushes..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed"; git rebase --abort || true; exit 1; }
            git push
          fi

      - name: Ping sitemaps
        run: |
          node scripts/ping-sitemaps.js

      # Note: No need to trigger deployment explicitly
      # The push above will automatically trigger build-and-deploy.yml via push event

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting 5 minutes for deployment to complete..."
          sleep 300

      - name: Health check
        continue-on-error: true
        run: |
          echo "🏥 Checking site health..."
          for locale in fr en de es pt; do
            echo "Checking /${locale}/"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://ark-fid.ch/${locale}/")
            if [ "$STATUS" = "200" ]; then
              echo "✅ ${locale}: OK"
            else
              echo "::warning::❌ ${locale}: Failed (HTTP $STATUS)"
            fi
          done

          echo "Checking /fr/ressources/"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://ark-fid.ch/fr/ressources/")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Resources page: OK"
          else
            echo "::warning::❌ Resources page: Failed (HTTP $STATUS)"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 🎉 AI Resources Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What Happened" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ AI generated a new long-form article (FR canonical + translations)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Trend signals used for topic selection (SEO optimization)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ References validated and cleaned automatically" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Changes committed and deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Notes" >> $GITHUB_STEP_SUMMARY
          echo "- Check the commit diff to see what was added/removed" >> $GITHUB_STEP_SUMMARY
          echo "- Check warnings above if any cleanup was needed" >> $GITHUB_STEP_SUMMARY
          echo "- The workflow **always succeeds** - bad content is auto-removed" >> $GITHUB_STEP_SUMMARY
