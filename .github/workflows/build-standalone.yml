name: Build Standalone Bundle

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload release.tgz as artifact"
        type: boolean
        default: true
      deploy:
        description: "After build, SCP artifact to server"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS artifact (optional)
        run: npm run css:build

      - name: Build Next.js (standalone)
        run: npm run build

      - name: Package standalone bundle
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public 2>/dev/null || true
          tar -czf release.tgz .next/standalone

      - name: Upload artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: release.tgz
          path: release.tgz
          retention-days: 7

  # Optional: add a deploy job that scps release.tgz to your server
  # To enable, define repository secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY
  # and set workflow_dispatch input `deploy` to true.
  deploy:
    if: ${{ inputs.deploy == true }}
    needs: build
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ vars.SSH_PORT || 22 }}
      REMOTE_PATH: ${{ vars.REMOTE_PATH || '/srv/customer/sites/ark-fid.ch' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release.tgz

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.SSH_KEY }}

      - name: Copy release to server
        run: |
          scp -P "$SSH_PORT" -o StrictHostKeyChecking=no release.tgz "$SSH_USER@$SSH_HOST:$REMOTE_PATH/release.tgz"

      - name: Deploy on server (extract + restart)
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'EOSSH'
            set -e
            cd "$REMOTE_PATH"
            # Extract new bundle
            rm -rf .next/standalone || true
            tar -xzf release.tgz
            # Create/Update simple restart script and PID management
            cat > start.sh << 'EOF'
            #!/usr/bin/env bash
            set -e
            cd "$(dirname "$0")"
            if [ -f app.pid ]; then
              if kill -0 "$(cat app.pid)" 2>/dev/null; then
                kill "$(cat app.pid)" || true
                sleep 1
              fi
            fi
            nohup node .next/standalone/server.js > app.log 2>&1 & echo $! > app.pid
            echo "Started: PID $(cat app.pid)"
            EOF
            chmod +x start.sh
            # Try systemd user service first, else use PM2 if available, else use start.sh
            if command -v systemctl >/dev/null 2>&1 && systemctl --user status ark-fid >/dev/null 2>&1; then
              systemctl --user restart ark-fid || true
            elif command -v pm2 >/dev/null 2>&1; then
              pm2 startOrReload ecosystem.config.js || pm2 start "node .next/standalone/server.js" --name ark-fid --update-env || true
            else
              ./start.sh
            fi
          EOSSH
