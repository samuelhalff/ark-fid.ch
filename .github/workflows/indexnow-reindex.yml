name: IndexNow Reindex

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - name: Call IndexNow reindex endpoint
        env:
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          URL="${SITE_URL:-https://ark-fid.ch}/api/indexnow/reindex"
          echo "POST $URL"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST "$URL" \
              -H "Content-Type: application/json" \
              -H "x-indexnow-secret: ${INDEXNOW_SECRET}" \
              -d "{}") || STATUS=000
            echo "Status: $STATUS"
            cat /tmp/resp.json || true
            if [ "$STATUS" = "200" ]; then
              echo "Reindex request succeeded"; exit 0
            fi
            echo "Retry in $((i*5))s..."; sleep $((i*5))
          done
          echo "Reindex request failed after retries"; cat /tmp/resp.json; exit 1
