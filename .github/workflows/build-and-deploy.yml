name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          BUILD_SOURCEMAPS: "false"
        run: npm run build

      - name: Prepare artifact
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        run: tar -czf next-standalone.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          compression-level: 0
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: ./artifact

      - name: Prepare partial artifact
        run: cp artifact/next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Upload release to server (rsync)
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.DEPLOY_SSH_PASSWORD }}" rsync -av \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_SSH_PORT }}" \
            artifact/next-standalone.tar.gz.part \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/srv/customer/sites/ark-fid.ch/artifact/

      - name: Extract, symlink and cleanup releases
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.DEPLOY_SSH_PASSWORD }}" ssh -p ${{ secrets.DEPLOY_SSH_PORT }} -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} bash -lc '
              set -euo pipefail
              BASE_DIR="/srv/customer/sites/ark-fid.ch"
              RELEASES_DIR="$BASE_DIR/releases"
              CURRENT_LINK="$BASE_DIR/current"
              ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz"
              PART="$BASE_DIR/artifact/next-standalone.tar.gz.part"
              TS=$(date +%Y%m%d%H%M%S)
              REL_DIR="$RELEASES_DIR/$TS"
              TMP="/tmp/ark-fid-release-$TS"
              LOG="$BASE_DIR/deploy.extract.log"

              mkdir -p "$RELEASES_DIR" "$TMP"

              [ -f "$PART" ] && mv "$PART" "$ARTIFACT"
              cp "$ARTIFACT" "$TMP/artifact.tar.gz"

              gzip -cd "$TMP/artifact.tar.gz" > "$TMP/.payload.tar"
              tar -xf "$TMP/.payload.tar" --no-same-owner --no-same-permissions -C "$TMP"
              rm -f "$TMP/.payload.tar"

              for f in server.js .next/BUILD_ID .next/static; do
                [ -e "$TMP/$f" ] || { echo "[deploy] Missing required: $f" >> "$LOG"; exit 1; }
              done

              mv "$TMP" "$REL_DIR" || { cp -r "$TMP"/* "$REL_DIR"/ && rm -rf "$TMP"; }
              
              # Link shared .env file
              mkdir -p "$BASE_DIR/shared"
              if [ -f "$BASE_DIR/shared/.env" ]; then
                ln -sfn "$BASE_DIR/shared/.env" "$REL_DIR/.env"
                echo "[deploy] Linked .env from shared directory" >> "$LOG"
              else
                echo "[deploy] Warning: No .env file in shared directory" >> "$LOG"
              fi
              
              ln -sfn "$REL_DIR" "$CURRENT_LINK"

              echo "$TS" > "$BASE_DIR/last_release_ts"
              
              echo "[deploy] Release $TS deployed successfully" >> "$LOG"

              # Cleanup old releases (keep 4) - don't fail deployment if this fails
              KEEP=4
              (
                cd "$RELEASES_DIR" 2>/dev/null || { echo "[cleanup] Warning: Could not access releases dir" >> "$LOG"; exit 0; }
                releases=$(ls -1t 2>/dev/null | tail -n +$((KEEP+1)) 2>/dev/null || true)
                for rel in $releases; do
                  if [ -d "$rel" ] && [ "$rel" != "$TS" ]; then
                    echo "[cleanup] Removing old release: $rel" >> "$LOG"
                    rm -rf "$RELEASES_DIR/$rel" 2>/dev/null || echo "[cleanup] Warning: Failed to remove $rel" >> "$LOG"
                  fi
                done
              ) || true
              
              echo "[deploy] Deployment complete" >> "$LOG"
            '

      # Restart server - resilient to connection drops and process kills
      - name: Restart Node.js server
        run: |
          set +e  # Don't exit on error
          sudo apt-get install -y sshpass
          
          echo "[restart] Step 1: Stopping current Node.js process..."
          # Kill process, ignore exit codes (process might not exist, SSH might drop)
          sshpass -p "${{ secrets.DEPLOY_SSH_PASSWORD }}" ssh \
            -p ${{ secrets.DEPLOY_SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
            'pkill -f "node.*server.js" && echo "[restart] Process killed" || echo "[restart] No process to kill"' 2>&1 || echo "[restart] Kill command completed (connection may have dropped)"
          
          echo "[restart] Step 2: Waiting 20 seconds for cleanup and connection reset..."
          sleep 20
          
          echo "[restart] Step 3: Starting new Node.js process..."
          # Start new process, retry up to 3 times if connection fails
          for i in 1 2 3; do
            echo "[restart] Start attempt $i/3..."
            if sshpass -p "${{ secrets.DEPLOY_SSH_PASSWORD }}" ssh \
              -p ${{ secrets.DEPLOY_SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
              'cd /srv/customer/sites/ark-fid.ch/current && NODE_ENV=production nohup node server.js > server.out 2>&1 & echo "[restart] Process started with PID $!"' 2>&1; then
              echo "[restart] OK - Server start succeeded"
              break
            else
              echo "[restart] WARNING - Start attempt $i failed, retrying in 5s..."
              sleep 5
            fi
          done
          
          echo "[restart] Step 4: Waiting 10 seconds for process to stabilize..."
          sleep 10
          
          echo "[restart] OK - Restart sequence complete"
          set -e  # Re-enable exit on error

      # Health check
      - name: Health check and warmup
        run: |
          sudo apt-get install -y curl
          ATTEMPTS=40; SLEEP=3; OK=0
          for i in $(seq 1 $ATTEMPTS); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L "https://ark-fid.ch/fr/")
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Health check OK (200 from /fr/)"
              OK=1
              break
            fi
            echo "Waiting for server... ($i/$ATTEMPTS, got $STATUS)"
            sleep $SLEEP
          done
          [ "$OK" -eq 1 ] || { echo "❌ Health check failed"; exit 1; }

          echo "[deploy] Warming up main paths..."
          for path in "/" "/en/" "/fr/" "/de/" "/es/" "/pt/"; do
            curl -fsSL "https://ark-fid.ch$path" >/dev/null 2>&1 || true
          done

          echo "[deploy] Warming up image assets..."
          curl -fsSL "https://ark-fid.ch/fr/" | grep -Eo 'src="/[^"]+\.(png|jpg|jpeg|webp|avif|svg)"' \
            | sed 's/src="//' | sed 's/"$//' \
            | while read -r img; do
                curl -fsSL "https://ark-fid.ch$img" >/dev/null 2>&1 || true
              done
