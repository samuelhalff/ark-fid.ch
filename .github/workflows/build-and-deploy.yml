name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "middleware.ts"
      - "server.js"
      - ".github/workflows/build-and-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "middleware.ts"
      - "server.js"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

# PR builds get their own concurrency group (cancellable) so they never queue
# behind or delay a production deploy; production runs stay serialized and
# uncancellable (killing a run mid-extract/symlink/restart is unsafe).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # No standalone tsc: `next build` type-checks (typescript.ignoreBuildErrors
      # is not set), so a separate pass duplicated ~9s of work.
      # Only the plain-JS guardrails tests run here: test:unit uses .ts test
      # files via Node type-stripping, which needs Node >=22 (CI is Node 20).
      - name: Fast safety checks (article guardrails)
        run: npm run test:guardrails

      - name: Check malformed internal markdown links (blocking)
        run: node scripts/fix-article-internal-links.js --check

      - name: Validate Turnstile config
        run: |
          if [ -z "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}" ]; then
            echo "Missing NEXT_PUBLIC_TURNSTILE_SITE_KEY in GitHub Secrets"
            exit 1
          fi

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          # github.sha in the key makes every run save its warmed cache (an
          # exact-key hit never re-saves, which froze the cache at the first
          # build after each lock/config change); restore-keys still pulls
          # the latest compatible entry.
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'next.config.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'next.config.js', 'tsconfig.json') }}-
            next-cache-${{ runner.os }}-

      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build

      - name: Prepare artifact
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        run: tar -czf next-standalone.tar.gz -C dist .

      # ─── Deploy (same job: skips a second runner, checkout, apt-get and
      # the GitHub artifact upload/download round-trip on the critical path;
      # the artifact is retained at the end, after production is healthy) ───

      - name: Install deploy tools
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: command -v sshpass >/dev/null || { sudo apt-get update && sudo apt-get install -y sshpass; }

      - name: Prepare partial artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: mkdir -p artifact && cp next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Upload release to server
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22

          # Transient SSH drops ("broken pipe") have killed single-attempt
          # uploads mid-transfer. Retry up to 3 times; --partial keeps the
          # interrupted destination file so retries resume via delta-sync
          # instead of resending the whole artifact; --checksum makes rsync
          # compare full content (never the size+mtime quick skip), so a
          # successful exit is an end-to-end integrity guarantee within the
          # same connection (this host throttles rapid follow-up ssh
          # sessions, so no separate hash round-trip). --timeout and
          # ConnectTimeout turn stalls into fast failures the loop can retry.
          for attempt in 1 2 3; do
            if sshpass -p "$PASS" rsync -av --partial --checksum --timeout=60 \
              -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -o ConnectTimeout=15 -p $PORT" \
              artifact/next-standalone.tar.gz.part \
              "$USER@$HOST:/srv/customer/sites/ark-fid.ch/artifact/"; then
              echo "Upload verified on attempt $attempt (rsync checksum)"
              exit 0
            fi
            echo "Upload attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "Upload failed after 3 attempts"
          exit 1

      - name: Sync shared env (secrets -> prod)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          AZURE_AGENT_CHAT_NAME: ${{ secrets.AZURE_AGENT_CHAT_NAME }}
          AZURE_AGENT_ENDPOINT: ${{ secrets.AZURE_AGENT_ENDPOINT }}
          AZURE_AGENT_API_KEY: ${{ secrets.AZURE_AGENT_API_KEY }}
          AZURE_AGENT_CHAT_RESPONSES_API_VERSION: ${{ secrets.AZURE_AGENT_CHAT_RESPONSES_API_VERSION }}
          AZURE_AGENT_RESPONSES_API_VERSION: ${{ secrets.AZURE_AGENT_RESPONSES_API_VERSION }}
          MSGRAPH_TENANT_ID: ${{ secrets.MSGRAPH_TENANT_ID }}
          MSGRAPH_CLIENT_ID: ${{ secrets.MSGRAPH_CLIENT_ID }}
          MSGRAPH_CLIENT_SECRET: ${{ secrets.MSGRAPH_CLIENT_SECRET }}
          SP_SITE_HOSTNAME: ${{ secrets.SP_SITE_HOSTNAME }}
          SP_SITE_PATH: ${{ secrets.SP_SITE_PATH }}
          SP_LEADS_LIST_NAME: ${{ secrets.SP_LEADS_LIST_NAME }}
          SP_LEADS_FIELD_TITLE: ${{ secrets.SP_LEADS_FIELD_TITLE }}
          SP_LEADS_FIELD_EMAIL: ${{ secrets.SP_LEADS_FIELD_EMAIL }}
          SP_LEADS_FIELD_TOKEN_HASH: ${{ secrets.SP_LEADS_FIELD_TOKEN_HASH }}
          SP_LEADS_FIELD_TRANSCRIPT: ${{ secrets.SP_LEADS_FIELD_TRANSCRIPT }}
          SP_LEADS_FIELD_NAME: ${{ secrets.SP_LEADS_FIELD_NAME }}
          SP_LEADS_FIELD_COMPANY: ${{ secrets.SP_LEADS_FIELD_COMPANY }}
          SP_LEADS_FIELD_PHONE: ${{ secrets.SP_LEADS_FIELD_PHONE }}
          SP_LEADS_FIELD_STATUS: ${{ secrets.SP_LEADS_FIELD_STATUS }}
          SP_LEADS_FIELD_SOURCE: ${{ secrets.SP_LEADS_FIELD_SOURCE }}
          SP_LEADS_FIELD_SESSION_ID: ${{ secrets.SP_LEADS_FIELD_SESSION_ID }}
          SP_LEADS_FIELD_PAGE_URL: ${{ secrets.SP_LEADS_FIELD_PAGE_URL }}
          SP_LEADS_FIELD_REFERRER: ${{ secrets.SP_LEADS_FIELD_REFERRER }}
          SP_LEADS_FIELD_UTM_SOURCE: ${{ secrets.SP_LEADS_FIELD_UTM_SOURCE }}
          SP_LEADS_FIELD_UTM_MEDIUM: ${{ secrets.SP_LEADS_FIELD_UTM_MEDIUM }}
          SP_LEADS_FIELD_UTM_CAMPAIGN: ${{ secrets.SP_LEADS_FIELD_UTM_CAMPAIGN }}
          SP_LEADS_FIELD_UTM_TERM: ${{ secrets.SP_LEADS_FIELD_UTM_TERM }}
          SP_LEADS_FIELD_UTM_CONTENT: ${{ secrets.SP_LEADS_FIELD_UTM_CONTENT }}
          SP_LEADS_FIELD_LAST_MESSAGE_AT: ${{ secrets.SP_LEADS_FIELD_LAST_MESSAGE_AT }}
          SP_LEADS_FIELD_LAST_USER_MESSAGE: ${{ secrets.SP_LEADS_FIELD_LAST_USER_MESSAGE }}
          SP_LEADS_FIELD_LAST_ASSISTANT_MESSAGE: ${{ secrets.SP_LEADS_FIELD_LAST_ASSISTANT_MESSAGE }}
          SP_LEADS_FIELD_INITIAL_MESSAGE: ${{ secrets.SP_LEADS_FIELD_INITIAL_MESSAGE }}
          AGENT_LEAD_TOKEN_SECRET: ${{ secrets.AGENT_LEAD_TOKEN_SECRET }}
          FORMSPARK_ACTION_URL: ${{ secrets.FORMSPARK_ACTION_URL }}
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22

          BASE="/srv/customer/sites/ark-fid.ch"
          SFTP_OPTS=(-P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20)

          # Secrets only ever touch 0600 files in a private temp dir that is
          # removed on exit; nothing here prints a value (key names only).
          umask 077
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          python3 - "$WORK/env_values" <<'PY'
          import os, sys
          keys = [
            "NEXT_PUBLIC_TURNSTILE_SITE_KEY",
            "TURNSTILE_SECRET_KEY",
            "AZURE_AGENT_CHAT_NAME",
            "AZURE_AGENT_ENDPOINT",
            "AZURE_AGENT_API_KEY",
            "AZURE_AGENT_CHAT_RESPONSES_API_VERSION",
            "AZURE_AGENT_RESPONSES_API_VERSION",
            "MSGRAPH_TENANT_ID",
            "MSGRAPH_CLIENT_ID",
            "MSGRAPH_CLIENT_SECRET",
            "SP_SITE_HOSTNAME",
            "SP_SITE_PATH",
            "SP_LEADS_LIST_NAME",
            "SP_LEADS_FIELD_TITLE",
            "SP_LEADS_FIELD_EMAIL",
            "SP_LEADS_FIELD_TOKEN_HASH",
            "SP_LEADS_FIELD_TRANSCRIPT",
            "SP_LEADS_FIELD_NAME",
            "SP_LEADS_FIELD_COMPANY",
            "SP_LEADS_FIELD_PHONE",
            "SP_LEADS_FIELD_STATUS",
            "SP_LEADS_FIELD_SOURCE",
            "SP_LEADS_FIELD_SESSION_ID",
            "SP_LEADS_FIELD_PAGE_URL",
            "SP_LEADS_FIELD_REFERRER",
            "SP_LEADS_FIELD_UTM_SOURCE",
            "SP_LEADS_FIELD_UTM_MEDIUM",
            "SP_LEADS_FIELD_UTM_CAMPAIGN",
            "SP_LEADS_FIELD_UTM_TERM",
            "SP_LEADS_FIELD_UTM_CONTENT",
            "SP_LEADS_FIELD_LAST_MESSAGE_AT",
            "SP_LEADS_FIELD_LAST_USER_MESSAGE",
            "SP_LEADS_FIELD_LAST_ASSISTANT_MESSAGE",
            "SP_LEADS_FIELD_INITIAL_MESSAGE",
            "AGENT_LEAD_TOKEN_SECRET",
            "FORMSPARK_ACTION_URL",
          ]
          lines = []
          for key in keys:
            value = os.environ.get(key, "")
            if value:
              lines.append(f"{key}={value}")
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
            fh.write("".join(line + "\n" for line in lines))
          PY

          if [ ! -s "$WORK/env_values" ]; then
            echo "[deploy] No env values to sync."
            exit 0
          fi

          # SFTP, not ssh exec: exec channels on these ContainerSSH hosts can
          # fail silently or drop exit codes (seen on 57-105000, 2026-09-18),
          # which would leave the runtime env stale while the step looks
          # green. Same merge as before (update the keys CI owns, append new
          # ones, leave every other line of the server file alone), but done
          # on the runner: fetch, merge, upload, read back.
          #
          # The server file also holds keys CI does not own, so it is never
          # replaced unless the current copy was read first. "Absent" is only
          # accepted when the directory listing proves it.
          STATE=unknown
          for attempt in 1 2 3; do
            rm -f "$WORK/env_remote" "$WORK/ls_out"
            sshpass -p "$PASS" sftp "${SFTP_OPTS[@]}" "$USER@$HOST" > "$WORK/ls_out" 2>/dev/null <<SFTP || true
          get $BASE/shared/.env $WORK/env_remote
          ls -la $BASE/shared
          SFTP
            # The listing runs after the get, in the same session: its "."
            # entry proves the session outlived the download, so a present
            # env_remote is complete, not a truncated transfer.
            if grep -Eq '(^|[[:space:]/])\.$' "$WORK/ls_out"; then
              if [ -f "$WORK/env_remote" ]; then STATE=present; break; fi
              if ! grep -Eq '(^|[[:space:]/])\.env$' "$WORK/ls_out"; then
                STATE=absent; : > "$WORK/env_remote"; break
              fi
            fi
            echo "[deploy] could not read shared/.env (attempt $attempt)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          if [ "$STATE" = "unknown" ]; then
            echo "::error::Could not read the server env file over SFTP; refusing to overwrite it. Production unchanged."
            exit 1
          fi

          python3 - "$WORK/env_remote" "$WORK/env_values" "$WORK/env_merged" <<'PY'
          import sys
          remote_path, values_path, merged_path = sys.argv[1:4]
          def load(path):
            with open(path, encoding="utf-8", errors="surrogateescape", newline="") as fh:
              lines = fh.read().split("\n")
            if lines and lines[-1] == "":
              lines.pop()
            return lines
          lines = load(remote_path)
          changed, added, unchanged = [], [], 0
          for entry in load(values_path):
            key = entry.split("=", 1)[0]
            hits = [i for i, line in enumerate(lines) if line.startswith(key + "=")]
            if not hits:
              lines.append(entry)
              added.append(key)
            elif all(lines[i] == entry for i in hits):
              unchanged += 1
            else:
              for i in hits:
                lines[i] = entry
              changed.append(key)
          if changed or added:
            with open(merged_path, "w", encoding="utf-8", errors="surrogateescape", newline="") as fh:
              fh.write("".join(line + "\n" for line in lines))
          # Key names only, never values.
          print(f"[deploy] env sync: {unchanged} unchanged, {len(changed)} changed, {len(added)} added")
          if changed:
            print("[deploy] changed keys: " + " ".join(changed))
          if added:
            print("[deploy] added keys: " + " ".join(added))
          PY

          if [ ! -f "$WORK/env_merged" ]; then
            echo "[deploy] shared/.env already up to date; nothing written"
            exit 0
          fi

          # Upload beside the target, tighten the mode, then rename over it
          # (atomic posix-rename): the app never sees a half-written file.
          # The previous content is kept as shared/.env.prev (0600).
          {
            if [ "$STATE" = "present" ]; then
              echo "put $WORK/env_remote $BASE/shared/.env.prev"
              echo "chmod 600 $BASE/shared/.env.prev"
            fi
            echo "put $WORK/env_merged $BASE/shared/.env.sync-new"
            echo "chmod 600 $BASE/shared/.env.sync-new"
            echo "rename $BASE/shared/.env.sync-new $BASE/shared/.env"
            echo "get $BASE/shared/.env $WORK/env_check"
          } > "$WORK/batch"

          for attempt in 1 2 3; do
            rm -f "$WORK/env_check"
            sshpass -p "$PASS" sftp "${SFTP_OPTS[@]}" "$USER@$HOST" >/dev/null 2>&1 < "$WORK/batch" || true
            if [ -f "$WORK/env_check" ] && cmp -s "$WORK/env_merged" "$WORK/env_check"; then
              echo "[deploy] shared/.env written via sftp and read back identical"
              exit 0
            fi
            echo "[deploy] env upload not confirmed (attempt $attempt)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          echo "::error::shared/.env could not be written and verified over SFTP; aborting before the release switch"
          exit 1

      # ─── Extract, symlink and cleanup ───
      - name: Extract, symlink and cleanup releases
        id: extract
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22
          BASE="/srv/customer/sites/ark-fid.ch"
          BUILD_ID=$(cat dist/.next/BUILD_ID)

          # No separate ssh "probe" session: it gated nothing and every extra
          # session counts against the host's exec throttle.
          if sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -o ConnectTimeout=15 "$USER@$HOST" bash -lc '
            set -euo pipefail
            BASE_DIR="/srv/customer/sites/ark-fid.ch"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz"
            PART="$BASE_DIR/artifact/next-standalone.tar.gz.part"
            TS=$(date +%Y%m%d%H%M%S)
            REL_DIR="$RELEASES_DIR/$TS"
            STAGE_DIR="$RELEASES_DIR/.staging-$TS"
            LOG="$BASE_DIR/deploy.extract.log"

            echo "[deploy] Starting deployment at $(date)" >> "$LOG"
            echo "[deploy] Release timestamp: $TS" >> "$LOG"
            echo "[deploy] Target directory: $REL_DIR" >> "$LOG"

            # Stage inside releases/ (same filesystem): the final promotion
            # is a single atomic mv, and extraction happens in one pass
            # instead of copy + gunzip + tar (three reads of a 60MB file).
            mkdir -p "$RELEASES_DIR" "$STAGE_DIR"
            echo "[deploy] Created directories" >> "$LOG"

            [ -f "$PART" ] && mv "$PART" "$ARTIFACT" && echo "[deploy] Moved partial artifact to final location" >> "$LOG"

            echo "[deploy] Extracting artifact..." >> "$LOG"
            # Explicit guard: the ssh argument-flattening means `set -euo
            # pipefail` above does not reliably govern this body, and a
            # truncated artifact must never be promoted to a release.
            tar -xzf "$ARTIFACT" --no-same-owner --no-same-permissions -C "$STAGE_DIR" || { echo "[deploy] ERROR: artifact is corrupt or unextractable" >> "$LOG"; rm -rf "$STAGE_DIR"; exit 1; }
            echo "[deploy] Artifact extracted successfully" >> "$LOG"

            for f in server.js .next/BUILD_ID .next/static; do
              [ -e "$STAGE_DIR/$f" ] || { echo "[deploy] ERROR: Missing required file: $f" >> "$LOG"; rm -rf "$STAGE_DIR"; exit 1; }
            done
            echo "[deploy] All required files present" >> "$LOG"

            mv "$STAGE_DIR" "$REL_DIR" || { echo "[deploy] ERROR: release promotion failed" >> "$LOG"; rm -rf "$STAGE_DIR"; exit 1; }
            echo "[deploy] Moved to releases directory: $REL_DIR" >> "$LOG"

            mkdir -p "$BASE_DIR/shared"
            if [ -f "$BASE_DIR/shared/.env" ]; then
              ln -sfn "$BASE_DIR/shared/.env" "$REL_DIR/.env"
              echo "[deploy] Linked .env file" >> "$LOG"
            fi

            if [ -f "$REL_DIR/restart-server.sh" ]; then
              cp "$REL_DIR/restart-server.sh" "$BASE_DIR/shared/restart-server.sh" && chmod +x "$BASE_DIR/shared/restart-server.sh"
              echo "[deploy] Installed restart-server.sh to shared/" >> "$LOG"
            fi

            # Rollback state, read back by CI over SFTP. Written BEFORE the
            # switch so a switched release always has a recorded predecessor.
            PREV_REL=$(readlink "$CURRENT_LINK" 2>/dev/null || true)
            PREV_BUILD_ID=$(cat "$CURRENT_LINK/.next/BUILD_ID" 2>/dev/null || true)
            NEW_BUILD_ID=$(cat "$REL_DIR/.next/BUILD_ID")
            printf "TS=%s\nNEW_REL=%s\nNEW_BUILD_ID=%s\nPREV_REL=%s\nPREV_BUILD_ID=%s\n" "$TS" "$REL_DIR" "$NEW_BUILD_ID" "$PREV_REL" "$PREV_BUILD_ID" > "$BASE_DIR/deploy_state" || { echo "[deploy] ERROR: could not write deploy_state" >> "$LOG"; exit 1; }
            echo "[deploy] Previous release: ${PREV_REL:-none} (${PREV_BUILD_ID:-?})" >> "$LOG"

            ln -sfn "$REL_DIR" "$CURRENT_LINK"
            echo "$TS" > "$BASE_DIR/last_release_ts"
            echo "[deploy] Updated current symlink to $REL_DIR" >> "$LOG"
            echo "[deploy] Release $TS deployed successfully at $(date)" >> "$LOG"

            KEEP=4
            cd "$RELEASES_DIR" || exit 0
            # Only directories count as releases: a stray file as the last
            # loop item made the loop exit 1 under set -e and failed a live
            # deploy (houle.ai, 2026-09-25..30). Best-effort, never fatal.
            # Never removes the new or the previous (rollback target) release.
            ls -1t | while read -r rel; do if [ -d "$rel" ]; then echo "$rel"; fi; done | tail -n +$((KEEP+1)) | while read -r rel; do
              if [ "$rel" != "$TS" ] && [ "$RELEASES_DIR/$rel" != "$PREV_REL" ]; then
                rm -rf "${RELEASES_DIR:?}/$rel" && echo "[deploy] Cleaned up old release: $rel" >> "$LOG"
              fi
            done || echo "[deploy] WARN: release cleanup incomplete" >> "$LOG"
            echo "[deploy] Cleanup completed, keeping last $KEEP releases" >> "$LOG"
          '; then
            RC=0
          else
            RC=$?
          fi
          echo "[deploy] extract session exit code: $RC"

          # ssh exec exit codes on these hosts are not trustworthy on their
          # own: read the outcome back over SFTP (what current/ points at now).
          for attempt in 1 2 3; do
            rm -f deploy_state disk_build
            sshpass -p "$PASS" sftp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20 "$USER@$HOST" >/dev/null <<SFTP || true
          get $BASE/deploy_state deploy_state
          get $BASE/current/.next/BUILD_ID disk_build
          SFTP
            [ -s deploy_state ] && [ -s disk_build ] && break
            echo "[deploy] SFTP read-back attempt $attempt incomplete"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done

          # Both tolerate a missing file: an incomplete read-back must reach
          # the live gate (and its rollback), not abort this step.
          DISK_BUILD=$(cat disk_build 2>/dev/null | tr -d '[:space:]' || true)
          field() { sed -n "s/^$1=//p" deploy_state 2>/dev/null | head -n1 || true; }
          STATE_BUILD=$(field NEW_BUILD_ID)
          echo "[deploy] expected build $BUILD_ID; current/ on disk: ${DISK_BUILD:-unreadable}"

          if [ -n "$DISK_BUILD" ] && [ "$DISK_BUILD" != "$BUILD_ID" ]; then
            echo "::error::Release was not promoted (current/ is $DISK_BUILD, expected $BUILD_ID; ssh exit $RC). Production unchanged."
            exit 1
          fi
          # Unreadable read-back: do not guess, let the live gate decide.
          [ -n "$DISK_BUILD" ] || echo "::warning::could not read current/ over SFTP; relying on live verification"
          if [ "$STATE_BUILD" = "$BUILD_ID" ]; then
            echo "prev_rel=$(field PREV_REL)" >> "$GITHUB_OUTPUT"
            echo "prev_build_id=$(field PREV_BUILD_ID)" >> "$GITHUB_OUTPUT"
            echo "[deploy] previous release: $(field PREV_REL) ($(field PREV_BUILD_ID))"
          else
            echo "::warning::deploy_state does not match this build; automatic rollback unavailable"
          fi
          [ "$RC" -eq 0 ] || echo "::warning::ssh exec returned $RC but current/ holds the new build; continuing to live verification"

      # ─── Restart server ───
      - name: Restart Node.js server
        id: restart
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        timeout-minutes: 3
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22

          # HTTPS-first restart. Observed in production (run 30006…): the ssh
          # session for the restart step is the 3rd+ of the run and the host's
          # session throttle kills it — while the supervisor loop happily
          # respawns node inside the NEW current/ after the kill endpoint
          # fires. So the normal path uses no ssh at all: kill over HTTPS,
          # then verify the new BUILD_ID answers. The managed server-side
          # script (installed to shared/ by the extract step) is only invoked
          # as recovery if the supervisor itself is gone.
          BUILD_ID=$(cat dist/.next/BUILD_ID)
          TOKEN="${{ secrets.RESTART_SECRET_TOKEN }}"
          echo "[restart] Expecting build $BUILD_ID"

          verify_build() {
            local checks=$1
            local i live
            for i in $(seq 1 "$checks"); do
              live=$(curl -s --max-time 4 "https://ark-fid.ch/api/health/?d=${GITHUB_RUN_ID}-${RANDOM}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("buildId",""))' 2>/dev/null || true)
              if [ "$live" = "$BUILD_ID" ]; then
                echo "[restart] ✅ Build $BUILD_ID confirmed live (check $i)"
                return 0
              fi
              sleep 2
            done
            echo "[restart] Live buildId '${live:-none}' != expected '$BUILD_ID'"
            return 1
          }

          echo "[restart] Requesting process restart via kill endpoint..."
          curl --connect-timeout 5 --max-time 20 -X POST "https://ark-fid.ch/api/kill/" -H "Authorization: Bearer $TOKEN" -s -o /dev/null -w "[restart] Kill request status: %{http_code}\n" || echo "[restart] Kill request failed"

          # Supervisor respawn typically brings the new build up in seconds.
          if verify_build 30; then exit 0; fi

          # Recovery: supervisor likely dead — run the managed restart script
          # over ssh (session may be throttled; retry with spacing).
          echo "[restart] ⚠ Supervisor respawn did not deliver the new build; invoking managed restart"
          for attempt in 1 2 3; do
            if OUT=$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=15 "$USER@$HOST" "bash /srv/customer/sites/ark-fid.ch/shared/restart-server.sh" 2>&1); then
              echo "[restart] managed restart: $OUT"
              break
            fi
            echo "[restart] ssh attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 20
          done

          if verify_build 30; then exit 0; fi
          echo "[restart] ❌ Could not confirm build $BUILD_ID live"
          exit 1

      # ─── Gate: the new build answers and the site serves pages ───
      - name: Verify release is live
        id: verify
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        timeout-minutes: 5
        run: |
          BUILD_ID=$(cat dist/.next/BUILD_ID)
          C=(--connect-timeout 5 --max-time 8 -s)
          # A 200 alone proves nothing (Infomaniak's maintenance page is a
          # 200, and the old process can still answer while terminating):
          # the health endpoint must report the deployed BUILD_ID and /fr/
          # must return 200, twice in a row.
          PASS_N=0
          for i in $(seq 1 40); do
            LIVE=$(curl "${C[@]}" "https://ark-fid.ch/api/health/?d=${GITHUB_RUN_ID}-${RANDOM}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("buildId",""))' 2>/dev/null || true)
            STATUS=$(curl "${C[@]}" -L -o /dev/null -w '%{http_code}' "https://ark-fid.ch/fr/" || true)
            echo "[verify] $i: build=${LIVE:-none} /fr/=${STATUS:-000}"
            if [ "$LIVE" = "$BUILD_ID" ] && [ "$STATUS" = "200" ]; then
              PASS_N=$((PASS_N + 1))
              if [ "$PASS_N" -ge 2 ]; then echo "[verify] build $BUILD_ID live; /fr/ returns 200"; exit 0; fi
            else
              PASS_N=0
            fi
            sleep 3
          done
          echo "::error::Build $BUILD_ID not verified live on ark-fid.ch"
          exit 1

      # Runs when the restart or the live gate failed after the symlink
      # switch. SFTP only for the switch back (the reliable channel); the job
      # always ends red.
      - name: Roll back to previous release
        if: failure() && (steps.restart.outcome == 'failure' || steps.verify.outcome == 'failure')
        timeout-minutes: 12
        env:
          PREV_REL: ${{ steps.extract.outputs.prev_rel }}
          PREV_BUILD_ID: ${{ steps.extract.outputs.prev_build_id }}
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22
          TOKEN="${{ secrets.RESTART_SECRET_TOKEN }}"
          BASE="/srv/customer/sites/ark-fid.ch"
          BUILD_ID=$(cat dist/.next/BUILD_ID)

          # The extract step exports the previous release only when its SFTP
          # read-back worked. If it did not, read deploy_state again now: it
          # is only trusted when it describes this very build.
          field() { sed -n "s/^$1=//p" deploy_state 2>/dev/null | head -n1 || true; }
          if [ -z "$PREV_REL" ] || [ -z "$PREV_BUILD_ID" ]; then
            for attempt in 1 2 3; do
              rm -f deploy_state
              sshpass -p "$PASS" sftp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20 "$USER@$HOST" >/dev/null <<SFTP || true
          get $BASE/deploy_state deploy_state
          SFTP
              if [ -s deploy_state ]; then break; fi
              echo "[rollback] deploy_state read attempt $attempt failed"
              [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
            done
            if [ "$(field NEW_BUILD_ID)" = "$BUILD_ID" ]; then
              PREV_REL=$(field PREV_REL)
              PREV_BUILD_ID=$(field PREV_BUILD_ID)
              echo "[rollback] previous release read from deploy_state: ${PREV_REL:-none} (${PREV_BUILD_ID:-?})"
            else
              echo "[rollback] deploy_state unreadable or not about build $BUILD_ID"
            fi
          fi

          if ! [[ "$PREV_REL" =~ ^/srv/customer/sites/ark-fid\.ch/releases/[0-9]{14}$ ]] || [ -z "$PREV_BUILD_ID" ] || [ "$PREV_BUILD_ID" = "$BUILD_ID" ]; then
            echo "::error::No usable previous release recorded (rel='$PREV_REL' build='$PREV_BUILD_ID'); roll back manually (see docs/deploy-ci.md)"
            exit 1
          fi

          # Atomic swap over SFTP (posix-rename of a fresh symlink onto
          # current), then read current/.next/BUILD_ID back to prove it.
          DONE=0
          for attempt in 1 2 3; do
            rm -f rb_build
            sshpass -p "$PASS" sftp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20 "$USER@$HOST" >/dev/null <<SFTP || true
          -rm $BASE/current.rollback
          symlink $PREV_REL $BASE/current.rollback
          rename $BASE/current.rollback $BASE/current
          get $BASE/current/.next/BUILD_ID rb_build
          SFTP
            if [ "$(cat rb_build 2>/dev/null | tr -d '[:space:]' || true)" = "$PREV_BUILD_ID" ]; then DONE=1; break; fi
            echo "[rollback] attempt $attempt not confirmed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          if [ "$DONE" -ne 1 ]; then
            echo "::error::ROLLBACK FAILED: current/ could not be pointed back to $PREV_REL; intervene now"
            exit 1
          fi
          echo "[rollback] current -> $PREV_REL ($PREV_BUILD_ID) on disk"

          C=(--connect-timeout 4 --max-time 4 -s)
          live_build() { curl "${C[@]}" "https://ark-fid.ch/api/health/?d=${GITHUB_RUN_ID}-${RANDOM}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("buildId",""))' 2>/dev/null || true; }
          wait_prev() {
            local i live status
            for i in $(seq 1 "$1"); do
              live=$(live_build)
              status=$(curl "${C[@]}" -L -o /dev/null -w '%{http_code}' "https://ark-fid.ch/fr/" || true)
              echo "[rollback] $i: build=${live:-none} /fr/=${status:-000}"
              if [ "$live" = "$PREV_BUILD_ID" ] && [ "$status" = "200" ]; then return 0; fi
              sleep 2
            done
            return 1
          }

          # The supervisor loop respawns node from current/. If the previous
          # build is still the one answering (the new one never started),
          # there is nothing to restart; otherwise ask the running process to
          # exit so the supervisor starts the previous release.
          if [ "$(live_build)" != "$PREV_BUILD_ID" ]; then
            curl --connect-timeout 5 --max-time 20 -X POST "https://ark-fid.ch/api/kill/" -H "Authorization: Bearer $TOKEN" -s -o /dev/null -w "[rollback] Kill request status: %{http_code}\n" || echo "[rollback] Kill request failed"
          fi
          if wait_prev 25; then
            echo "::error::Deploy of $BUILD_ID failed verification; rolled back to $PREV_BUILD_ID (site answering)"
            exit 1
          fi

          # Supervisor likely dead: managed restart script over ssh (the only
          # exec-dependent path; session may be throttled, so retry spaced).
          echo "[rollback] previous build not answering; invoking managed restart"
          for attempt in 1 2 3; do
            if OUT=$(sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=15 "$USER@$HOST" "bash /srv/customer/sites/ark-fid.ch/shared/restart-server.sh" 2>&1); then
              echo "[rollback] managed restart: $OUT"
              break
            fi
            echo "[rollback] ssh attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          if wait_prev 25; then
            echo "::error::Deploy of $BUILD_ID failed verification; rolled back to $PREV_BUILD_ID (site answering after managed restart)"
            exit 1
          fi
          echo "::error::Rolled back on disk to $PREV_BUILD_ID but the site did not recover; intervene now (see docs/deploy-ci.md)"
          exit 1

      - name: Warm up caches (non-blocking)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          CURL_TIMEOUTS=(--connect-timeout 5 --max-time 8)
          echo "[deploy] Warming up paths..."
          for path in "/" "/en/" "/fr/" "/de/" "/es/" "/pt/"; do
            curl "${CURL_TIMEOUTS[@]}" -fsSL "https://ark-fid.ch$path" >/dev/null 2>&1 || true
          done

          echo "[deploy] Warmup next/image cache from locale home pages (non-blocking)"
          TMP=$(mktemp)
          collect_images() {
            echo "$1" | grep -Eo '/_next/image/\?url=[^" ]+' | sed 's/&amp;/\&/g' >> "$TMP"
          }
          BASE_PATHS=("/" "/en/" "/fr/" "/de/" "/es/" "/pt/")
          for path in "${BASE_PATHS[@]}"; do
            HTML=$(curl "${CURL_TIMEOUTS[@]}" -fsSL "https://ark-fid.ch$path" || true)
            collect_images "$HTML"
          done
          sort -u "$TMP" | head -n 40 > "$TMP.list"
          warm_images() {
            local accept="$1"
            while read -r u; do
              curl "${CURL_TIMEOUTS[@]}" -fsSL -H "Accept: $accept" "https://ark-fid.ch$u" >/dev/null 2>&1 || true
            done < "$TMP.list"
          }
          warm_images "image/webp,*/*"
          rm -f "$TMP.list"
          rm -f "$TMP"

          echo "[deploy] Deployment completed successfully"

      - name: Validate live sitemap (non-blocking)
        continue-on-error: true
        run: |
          echo "Checking sitemap format..."
          curl --connect-timeout 5 --max-time 20 -s "https://ark-fid.ch/sitemap.xml" | head -50
          if curl --connect-timeout 5 --max-time 20 -s "https://ark-fid.ch/sitemap.xml" | grep -m 1 -E '<loc>https://[^<]+/</loc>'; then
            echo "✅ Sitemap URLs have trailing slashes"
          else
            echo "Notice: Sitemap URLs may be missing trailing slashes"
          fi

      # Retained for manual/emergency access (nothing downloads it in CI:
      # the merged job deploys the local tarball directly). Runs last so the
      # upload cost is off the push→live critical path; always() keeps it
      # available for debugging failed deploys too.
      - name: Retain deployable artifact
        if: always() && hashFiles('next-standalone.tar.gz') != ''
        uses: actions/upload-artifact@v7
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
