name: Deploy via SSH to Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_HOST: ark-fid.ch
      DEPLOY_PATH: /srv/customer/sites/ark-fid.ch
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Create deployment artifact
        run: bash scripts/prepare-artifact.sh

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload artifact
        run: scp -P 22 artifact.tar.gz ${{ secrets.SSH_USER }}@${{ env.DEPLOY_HOST }}:/tmp/artifact.tar.gz

      - name: Deploy release
        run: |
          ssh -p 22 ${{ secrets.SSH_USER }}@${{ env.DEPLOY_HOST }} 'bash -s' <<'EOSSH'
          set -e
          base="/srv/customer/sites/ark-fid.ch"
          releases_dir="$base/releases"
          current_link="$base/current"
          timestamp=$(date +%Y%m%d%H%M%S)
          release_dir="$releases_dir/$timestamp"
          echo "Creating release directory $release_dir"
          mkdir -p "$release_dir"
          echo "Extracting artifact to $release_dir"
          tar -xzf /tmp/artifact.tar.gz -C "$release_dir"
          rm -f /tmp/artifact.tar.gz
          echo "Updating current symlink -> $release_dir"
          ln -sfn "$release_dir" "$current_link"
          echo "Release $timestamp deployed"
          EOSSH

      - name: Clean up old releases
        run: |
          ssh -p 22 ${{ secrets.SSH_USER }}@${{ env.DEPLOY_HOST }} 'bash -s' <<'EOSSH'
          base="/srv/customer/sites/ark-fid.ch"
          releases_dir="$base/releases"
          echo "Cleaning up old releases..."
          cd "$releases_dir"
          old_releases=$(ls -1t | sed -e '1,4d')
          if [ -z "$old_releases" ]; then
            echo "No old releases to remove"
          else
            echo "Removing old releases:"
            echo "$old_releases"
            rm -rf $old_releases || echo "Warning: failed to remove some releases"
          fi
          echo "Cleanup finished"
          EOSSH
        continue-on-error: true

      - name: Restart server and warmup
        run: |
          echo "Triggering restart..."
          curl -X POST "https://${{ env.DEPLOY_HOST }}/api/restart?token=${{ secrets.RESTART_TOKEN }}" || echo "Warning: restart request failed"
          echo "Waiting for server..."
          for i in {1..10}; do
            code=$(curl -o /dev/null -s -w "%{http_code}" "https://${{ env.DEPLOY_HOST }}/") || true
            if [ "$code" = "200" ]; then
              echo "Server is up (HTTP $code)"
              break
            else
              echo "Server not ready (HTTP $code)"
              sleep 5
            fi
          done
          echo "Warming up pages..."
          for page in "/" "/en/" "/fr/" "/de/" "/es/" "/pt/"; do
            curl -s "https://${{ env.DEPLOY_HOST }}$page" -o /dev/null && echo "Warmed $page" || echo "Failed to warm $page"
          done
        continue-on-error: true
