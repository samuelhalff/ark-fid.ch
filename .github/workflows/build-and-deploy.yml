name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          BUILD_SOURCEMAPS: "false"
        run: npm run build

      - name: Prepare artifact
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        run: tar -czf next-standalone.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          compression-level: 0
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: ./artifact

      - name: Prepare partial artifact
        run: cp artifact/next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Upload release to server (rsync)
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.DEPLOY_SSH_PASSWORD }}" rsync -av \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_SSH_PORT }}" \
            artifact/next-standalone.tar.gz.part \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/srv/customer/sites/ark-fid.ch/artifact/

      - name: Extract, symlink and cleanup releases
        run: |
          set -euo pipefail
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.DEPLOY_SSH_PASSWORD }}" ssh -p ${{ secrets.DEPLOY_SSH_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} bash -lc '
              set -euo pipefail
              BASE_DIR="/srv/customer/sites/ark-fid.ch"
              RELEASES_DIR="$BASE_DIR/releases"
              CURRENT_LINK="$BASE_DIR/current"
              ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz"
              PART="$BASE_DIR/artifact/next-standalone.tar.gz.part"
              TS=$(date +%Y%m%d%H%M%S)
              REL_DIR="$RELEASES_DIR/$TS"
              TMP="/tmp/ark-fid-release-$TS"
              LOG="$BASE_DIR/deploy.extract.log"

              mkdir -p "$RELEASES_DIR" "$TMP"

              [ -f "$PART" ] && mv "$PART" "$ARTIFACT"
              cp "$ARTIFACT" "$TMP/artifact.tar.gz"

              gzip -cd "$TMP/artifact.tar.gz" > "$TMP/.payload.tar"
              tar -xf "$TMP/.payload.tar" --no-same-owner --no-same-permissions -C "$TMP"
              rm -f "$TMP/.payload.tar"

              for f in server.js .next/BUILD_ID .next/static; do
                [ -e "$TMP/$f" ] || { echo "[deploy] Missing required: $f" >> "$LOG"; exit 1; }
              done

              mv "$TMP" "$REL_DIR" || { cp -r "$TMP"/* "$REL_DIR"/ && rm -rf "$TMP"; }
              ln -sfn "$REL_DIR" "$CURRENT_LINK"

              echo "$TS" > "$BASE_DIR/last_release_ts"

              # Cleanup old releases (keep 4)
              KEEP=4
              cd "$RELEASES_DIR" || exit 0
              releases=$(ls -1t | tail -n +$((KEEP+1)) || true)
              for rel in $releases; do
                echo "[cleanup] Removing old release: $rel" >> "$LOG"
                rm -rf "$RELEASES_DIR/$rel"
              done
            '

      # Restart via API (outside SSH so orchestrator kill doesn’t break CI)
      - name: Restart app via API
        run: |
          echo "[deploy] Calling /api/restart endpoint..."
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RESTART_SECRET_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://ark-fid.ch/api/restart || true
          echo "[deploy] Restart signal sent. Waiting 20s..."
          sleep 20

      # Health check
      - name: Health check and warmup
        run: |
          sudo apt-get install -y curl
          ATTEMPTS=40; SLEEP=3; OK=0
          for i in $(seq 1 $ATTEMPTS); do
            if curl -fsS "https://ark-fid.ch/" >/dev/null 2>&1; then
              echo "✅ Health check OK"
              OK=1
              break
            fi
            echo "Waiting for server... ($i/$ATTEMPTS)"
            sleep $SLEEP
          done
          [ "$OK" -eq 1" ] || { echo "❌ Health check failed"; exit 1; }

          echo "[deploy] Warming up main paths..."
          for path in "/" "/en/" "/fr/" "/de/" "/es/" "/pt/"; do
            curl -fsS "https://ark-fid.ch$path" >/dev/null 2>&1 || true
          done
