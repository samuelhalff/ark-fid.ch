name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          BUILD_SOURCEMAPS: "false"
        run: npm run build

      - name: Prepare artifact
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        run: tar -czf next-standalone.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          compression-level: 0
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      USER: ${{ secrets.DEPLOY_SSH_USER }}
      PASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
      PORT: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
      BASE_DIR: /srv/customer/sites/ark-fid.ch
      SITE: https://ark-fid.ch
    steps:
      - name: Checkout repo (for scripts if needed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: ./artifact

      - name: Prepare partial artifact
        run: cp artifact/next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Upload release to server (rsync over password SSH)
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y sshpass rsync
          sshpass -p "$PASS" rsync -av --partial --inplace \
            -e "ssh -o StrictHostKeyChecking=no -p $PORT" \
            artifact/next-standalone.tar.gz.part \
            "$USER@$HOST:$BASE_DIR/artifact/"

      - name: Extract, symlink and cleanup on server
        run: |
          set -e
          sudo apt-get install -y sshpass
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" bash -lc '
            set -eE -o pipefail
            BASE_DIR="'"$BASE_DIR"'"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz"
            PART="$BASE_DIR/artifact/next-standalone.tar.gz.part"
            TS=$(date +%Y%m%d%H%M%S)
            REL_DIR="$RELEASES_DIR/$TS"
            TMP="/tmp/ark-fid-release-$TS"
            LOG="$BASE_DIR/deploy.extract.log"

            mkdir -p "$RELEASES_DIR" "$TMP" "$B_
