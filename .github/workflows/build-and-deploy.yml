name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  workflow_dispatch:
  repository_dispatch:
    types: [ai-content-updated]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # ⚡ Key only on lockfile hash, not commit SHA (avoids cold cache every run)
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          BUILD_SOURCEMAPS: "false"
        run: npm run build

      - name: Prepare artifact
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        run: |
          tar -czf next-standalone.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          compression-level: 0
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: ./artifact

      - name: Prepare partial artifact name (.part)
        run: cp artifact/next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Upload release to server (rsync)
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.DEPLOY_SSH_PASSWORD }}" rsync -av \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_SSH_PORT || 22 }}" \
            artifact/next-standalone.tar.gz.part \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/srv/customer/sites/ark-fid.ch/artifact/

      - name: Ensure remote target directories
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 90s
          use_insecure_cipher: true
          script: |
            mkdir -p "/srv/customer/sites/ark-fid.ch/artifact" \
                     "/srv/customer/sites/ark-fid.ch/releases" \
                     "/srv/customer/sites/ark-fid.ch/shared"

      - name: Remote extract (via ssh)
        run: |
          set -euo pipefail
          sudo apt-get install -y sshpass
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT || 22 }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o IPQoS=throughput -p ${PORT}"
          sshpass -p "${PASS}" ssh ${SSH_OPTS} "${USER}@${HOST}" bash -lc '
            set -euo pipefail
            BASE_DIR="/srv/customer/sites/ark-fid.ch"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            PID_FILE="$BASE_DIR/ark-fid.pid"
            ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz"
            PART_ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz.part"
            TS=$(date +%Y%m%d%H%M%S)
            REL_DIR="$RELEASES_DIR/$TS"
            TMP_DIR="/tmp/ark-fid-release-$TS"
            LOG="$BASE_DIR/deploy.extract.log"

            mkdir -p "$RELEASES_DIR" "$TMP_DIR"
            echo "[deploy] Disk:" > "$LOG"
            df -h "$BASE_DIR" >> "$LOG" 2>&1 || true

            if [ -f "$PART_ARTIFACT" ]; then
              echo "[deploy] Finalize .part -> .tar.gz" >> "$LOG"
              mv "$PART_ARTIFACT" "$ARTIFACT"
            fi

            echo "[deploy] Copy artifact" >> "$LOG"
            cp "$ARTIFACT" "$TMP_DIR/artifact.tar.gz" >> "$LOG" 2>&1

            echo "[deploy] Decompress artifact" >> "$LOG"
            gzip -cd "$TMP_DIR/artifact.tar.gz" > "$TMP_DIR/.payload.tar"

            echo "[deploy] Extract tar" >> "$LOG"
            tar -xf "$TMP_DIR/.payload.tar" --no-same-owner --no-same-permissions -C "$TMP_DIR"
            rm -f "$TMP_DIR/.payload.tar"

            for f in server.js .next/BUILD_ID .next/static; do
              [ -e "$TMP_DIR/$f" ] || { echo "[deploy] Missing required: $f" >> "$LOG"; exit 1; }
            done

            # Extra validation: ensure CSS exists
            if [ ! -d "$TMP_DIR/.next/static/css" ]; then
              echo "[deploy] Missing CSS dir" >> "$LOG"; exit 1
            fi
            CSS_COUNT=$(find "$TMP_DIR/.next/static/css" -name "*.css" | wc -l)
            [ "$CSS_COUNT" -ge 1 ] || { echo "[deploy] No CSS files" >> "$LOG"; exit 1; }
            echo "[deploy] Validation passed: $CSS_COUNT CSS files" >> "$LOG"

            touch "$TMP_DIR/.extract_ok"
            echo "$TS" > "$BASE_DIR/last_release_ts"
          '

      - name: Switch symlink and restart (via ssh)
        run: |
          set -euo pipefail
          sudo apt-get install -y sshpass curl
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT || 22 }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o IPQoS=throughput -p ${PORT}"
          sshpass -p "${PASS}" ssh ${SSH_OPTS} "${USER}@${HOST}" bash -lc '
            set -euo pipefail
            BASE_DIR="/srv/customer/sites/ark-fid.ch"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            PID_FILE="$BASE_DIR/ark-fid.pid"
            LOG="$BASE_DIR/deploy.extract.log"

            TS="$(cat "$BASE_DIR/last_release_ts")"
            REL_DIR="$RELEASES_DIR/$TS"
            TMP_DIR="/tmp/ark-fid-release-$TS"
            [ -f "$TMP_DIR/.extract_ok" ] || { echo "[deploy] Extract marker missing" >> "$LOG"; exit 1; }

            echo "[deploy] Moving extracted release to $REL_DIR" >> "$LOG"
            mv "$TMP_DIR" "$REL_DIR" || { cp -r "$TMP_DIR"/* "$REL_DIR"/ && rm -rf "$TMP_DIR"; }

            [ -f "$BASE_DIR/shared/.env" ] && ln -sfn "$BASE_DIR/shared/.env" "$REL_DIR/.env"
            [ -f "$BASE_DIR/shared/.env.production" ] && ln -sfn "$BASE_DIR/shared/.env.production" "$REL_DIR/.env.production"

            ln -sfn "$REL_DIR" "$CURRENT_LINK"
            echo "Release: $TS" > "$CURRENT_LINK/.release-info"
            echo "Deployed: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$CURRENT_LINK/.release-info"
            echo "Directory: $REL_DIR" >> "$CURRENT_LINK/.release-info"

            cd "$CURRENT_LINK"
            # Stop old process if running
            if [ -f "$PID_FILE" ]; then
              OLD_PID="$(cat "$PID_FILE" 2>/dev/null || true)"
              if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                kill "$OLD_PID" || true
                sleep 2
                kill -9 "$OLD_PID" 2>/dev/null || true
              fi
              rm -f "$PID_FILE"
            fi
            pkill -9 -f "next-server" 2>/dev/null || true
            pkill -9 node 2>/dev/null || true

            PORT_VAL="${PORT_VAL:-${{ secrets.DEPLOY_PORT }}}"
            [ -z "${PORT_VAL:-}" ] && PORT_VAL=3000
            echo "[deploy] Starting server on port $PORT_VAL" >> "$LOG"
            setsid nohup node server.js > "$BASE_DIR/server.out" 2>&1 < /dev/null &
            NEW_PID=$!
            echo $NEW_PID > "$PID_FILE"
            echo "[deploy] Started detached process $NEW_PID" >> "$LOG"

            # Keep only 4 releases
            releases=$(ls -1 "$RELEASES_DIR" | sort)
            count=$(echo "$releases" | wc -l | tr -d " ")
            keep=4
            if [ "$count" -gt "$keep" ]; then
              to_delete=$((count - keep))
              echo "$releases" | head -n "$to_delete" | while read -r d; do rm -rf "$RELEASES_DIR/$d"; done
            fi

            # Health check
            ATTEMPTS=60; SLEEP=3; OK=0
            for i in $(seq 1 $ATTEMPTS); do
              if curl -fsS "http://127.0.0.1:$PORT_VAL/" >/dev/null 2>&1; then OK=1; break; fi
              sleep $SLEEP
            done
            if [ "$OK" -ne 1 ]; then
              echo "[deploy] Health check failed" >> "$LOG"
              tail -n 200 "$BASE_DIR/server.out" >&2 || true
              exit 1
            fi

            # Warmup cache
            warm_paths=("/" "/en/" "/fr/" "/de/" "/es/" "/pt/")
            for path in "${warm_paths[@]}"; do
              curl -fsS "http://127.0.0.1:$PORT_VAL${path}" >/dev/null 2>&1 || true
            done

            echo "[deploy] Done $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$LOG"
          '
