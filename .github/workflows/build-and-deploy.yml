  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: ./artifact

      - name: Prepare partial artifact
        run: cp artifact/next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Upload release to server (rsync, resilient)
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.DEPLOY_SSH_PASSWORD }}" rsync -avz \
            --partial --progress --timeout=60 \
            -e "ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p ${{ secrets.DEPLOY_SSH_PORT || 22 }}" \
            artifact/next-standalone.tar.gz.part \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/srv/customer/sites/ark-fid.ch/artifact/

      # --- Restart application ---
      - name: Restart application
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER: ${{ secrets.DEPLOY_SSH_USER }}
          PASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          RESTART_TOKEN: ${{ secrets.RESTART_SECRET_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get install -y sshpass curl
          echo "[deploy] Restarting application..."
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" 'bash -s' <<'EOSSH'
            set -euo pipefail
            BASE_DIR="/srv/customer/sites/ark-fid.ch"
            PID_FILE="$BASE_DIR/ark-fid.pid"
            CURRENT_DIR="$BASE_DIR/current"
            LOG_FILE="$BASE_DIR/server.out"
            PORT_VAL=3000

            echo "[restart] Trying API endpoint..."
            if curl -sL -X POST \
              -H "Authorization: Bearer $RESTART_TOKEN" \
              -H "Content-Type: application/json" \
              --max-time 5 \
              "https://ark-fid.ch/api/restart" >/dev/null 2>&1; then
              echo "[restart] ✅ Restart triggered via API"
              sleep 5
            else
              echo "[restart] ⚠️ API failed, fallback to PID kill"
              if [ -f "$PID_FILE" ]; then
                OLD_PID=$(cat "$PID_FILE")
                kill "$OLD_PID" 2>/dev/null || true
                sleep 2
              fi
              echo "[restart] Starting manually..."
              cd "$CURRENT_DIR"
              PORT=$PORT_VAL nohup node server.js > "$LOG_FILE" 2>&1 &
              echo $! > "$PID_FILE"
            fi
EOSSH
