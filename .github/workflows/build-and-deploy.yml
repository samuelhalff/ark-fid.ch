name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  workflow_dispatch:
  repository_dispatch:
    types: [ai-content-updated]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          BUILD_SOURCEMAPS: "false"
        run: npm run build

      - name: Prepare artifact
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        run: |
          tar -czf next-standalone.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          compression-level: 0
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: ./artifact

      - name: Prepare partial artifact name (.part)
        run: cp artifact/next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Upload release to server (rsync)
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.DEPLOY_SSH_PASSWORD }}" rsync -av -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_SSH_PORT || 22 }}" artifact/next-standalone.tar.gz.part ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/srv/customer/sites/ark-fid.ch/artifact/

      - name: Ensure remote target directories
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 90s
          use_insecure_cipher: true
          script: |
            mkdir -p "/srv/customer/sites/ark-fid.ch/artifact" "/srv/customer/sites/ark-fid.ch/releases" "/srv/customer/sites/ark-fid.ch/shared"

      # (chunked upload removed – rsync above handles robustness without chunking)

      - name: Remote extract (via ssh)
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y sshpass
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT || 22 }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o IPQoS=throughput -p ${PORT}"
          sshpass -p "${PASS}" ssh ${SSH_OPTS} "${USER}@${HOST}" bash -lc '
            set -euo pipefail
            BASE_DIR="/srv/customer/sites/ark-fid.ch"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            PID_FILE="$BASE_DIR/ark-fid.pid"
            ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz"
            PART_ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz.part"
            TS=$(date +%Y%m%d%H%M%S)
            REL_DIR="$RELEASES_DIR/$TS"
            TMP_DIR="/tmp/ark-fid-release-$TS"
            LOG="$BASE_DIR/deploy.extract.log"

            mkdir -p "$RELEASES_DIR" "$TMP_DIR"
            echo "[deploy] Disk:" > "$LOG"
            df -h "$BASE_DIR" >> "$LOG" 2>&1 || true

            if [ -f "$PART_ARTIFACT" ]; then
              echo "[deploy] Finalize .part -> .tar.gz" >> "$LOG"
              mv "$PART_ARTIFACT" "$ARTIFACT"
            fi
            echo "[deploy] Artifact:" >> "$LOG"
            ls -lh "$ARTIFACT" >> "$LOG" 2>&1

            echo "[deploy] Copy artifact to local temp" >> "$LOG"
            cp "$ARTIFACT" "$TMP_DIR/artifact.tar.gz" >> "$LOG" 2>&1

            echo "[deploy] Decompress artifact" >> "$LOG"
            if ! gzip -cd "$TMP_DIR/artifact.tar.gz" > "$TMP_DIR/.payload.tar" 2>>"$LOG"; then
              echo "[deploy] gzip failed" >> "$LOG"; exit 1; fi

            echo "[deploy] Extract tar" >> "$LOG"
            if ! tar -xf "$TMP_DIR/.payload.tar" --no-same-owner --no-same-permissions -C "$TMP_DIR" >>"$LOG" 2>&1; then
              echo "[deploy] tar extraction failed" >> "$LOG"; exit 1; fi
            rm -f "$TMP_DIR/.payload.tar" || true

            for f in server.js .next/BUILD_ID .next/static; do
              if [ ! -e "$TMP_DIR/$f" ]; then echo "[deploy] Missing required: $f" >> "$LOG"; exit 1; fi
            done
            
            # Additional validation: check CSS files exist
            if [ ! -d "$TMP_DIR/.next/static/css" ]; then
              echo "[deploy] Missing CSS directory" >> "$LOG"; exit 1
            fi
            CSS_COUNT=$(find "$TMP_DIR/.next/static/css" -name "*.css" | wc -l)
            if [ "$CSS_COUNT" -lt 1 ]; then
              echo "[deploy] No CSS files found" >> "$LOG"; exit 1
            fi
            echo "[deploy] Validation passed: found $CSS_COUNT CSS files" >> "$LOG"
            
            touch "$TMP_DIR/.extract_ok"
            echo "$TS" > "$BASE_DIR/last_release_ts"
          '

      - name: Switch symlink and restart (via ssh)
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y sshpass curl
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT || 22 }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o IPQoS=throughput -p ${PORT}"
          sshpass -p "${PASS}" ssh ${SSH_OPTS} "${USER}@${HOST}" bash -lc '
            set -euo pipefail
            BASE_DIR="/srv/customer/sites/ark-fid.ch"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            PID_FILE="$BASE_DIR/ark-fid.pid"
            LOG="$BASE_DIR/deploy.extract.log"

            TS="$(cat "$BASE_DIR/last_release_ts" 2>/dev/null || true)"
            [ -n "$TS" ] || { echo "[deploy] No last_release_ts" >> "$LOG"; exit 1; }
            REL_DIR="$RELEASES_DIR/$TS"
            TMP_DIR="/tmp/ark-fid-release-$TS"
            [ -f "$TMP_DIR/.extract_ok" ] || { echo "[deploy] Extract marker missing" >> "$LOG"; exit 1; }

            echo "[deploy] Moving extracted release to $REL_DIR" >> "$LOG"
            if ! mv "$TMP_DIR" "$REL_DIR" 2>>"$LOG"; then
              echo "[deploy] mv failed, trying cp -r" >> "$LOG"
              mkdir -p "$REL_DIR" >> "$LOG" 2>&1
              cp -r "$TMP_DIR"/* "$REL_DIR"/ >> "$LOG" 2>&1 && rm -rf "$TMP_DIR" >> "$LOG" 2>&1
              [ $? -eq 0 ] || { echo "[deploy] cp also failed" >> "$LOG"; exit 1; }
            fi
            [ -f "$BASE_DIR/shared/.env" ] && ln -sfn "$BASE_DIR/shared/.env" "$REL_DIR/.env"
            [ -f "$BASE_DIR/shared/.env.production" ] && ln -sfn "$BASE_DIR/shared/.env.production" "$REL_DIR/.env.production"
            ln -sfn "$REL_DIR" "$CURRENT_LINK"
            echo "Release: $TS" > "$CURRENT_LINK/.release-info"
            echo "Deployed: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$CURRENT_LINK/.release-info"
            echo "Directory: $REL_DIR" >> "$CURRENT_LINK/.release-info"

            cd "$CURRENT_LINK"
            # Stop existing process more reliably
            if [ -f "$PID_FILE" ]; then
              OLD_PID="$(cat "$PID_FILE" 2>/dev/null || true)"
              if [ -n "${OLD_PID:-}" ] && kill -0 "$OLD_PID" 2>/dev/null; then
                echo "[deploy] Stopping old process $OLD_PID" >> "$LOG"
                kill "$OLD_PID" || true
                sleep 2
                # Force kill if still running
                if kill -0 "$OLD_PID" 2>/dev/null; then
                  echo "[deploy] Force killing $OLD_PID" >> "$LOG"
                  kill -9 "$OLD_PID" || true
                  sleep 1
                fi
              fi
              rm -f "$PID_FILE"
            fi
            
            # Also kill any orphaned Node.js processes as backup
            echo "[deploy] Cleaning up any orphaned node processes" >> "$LOG"
            pkill -9 -f "node.*server\.js" >> "$LOG" 2>&1 || true
            killall -9 node >> "$LOG" 2>&1 || true
            sleep 2

            # Start new process
            PORT_VAL="${PORT_VAL:-${{ secrets.DEPLOY_PORT }}}"
            [ -z "${PORT_VAL:-}" ] && PORT_VAL=3000
            echo "[deploy] Starting server on port $PORT_VAL" >> "$LOG"
            nohup node server.js > "$BASE_DIR/server.out" 2>&1 &
            NEW_PID=$!
            echo $NEW_PID > "$PID_FILE"
            echo "[deploy] Started process $NEW_PID" >> "$LOG"

            releases=$(ls -1 "$RELEASES_DIR" 2>/dev/null | sort)
            count=$(echo "$releases" | wc -l | tr -d " ")
            keep=4
            if [ "$count" -gt "$keep" ]; then
              to_delete=$((count - keep))
              echo "$releases" | head -n "$to_delete" | while IFS= read -r d; do [ -n "$d" ] && rm -rf "$RELEASES_DIR/$d" || true; done
            fi

            ATTEMPTS=60; SLEEP=3; OK=0
            for i in $(seq 1 $ATTEMPTS); do
              if curl -fsS "http://127.0.0.1:$PORT_VAL/" >/dev/null 2>&1; then OK=1; break; fi
              echo "[deploy] Health check attempt $i/$ATTEMPTS" >> "$LOG"
              sleep $SLEEP
            done
            if [ "$OK" -ne 1 ]; then 
              echo "[deploy] Health check failed after $((ATTEMPTS * SLEEP)) seconds" >> "$LOG"
              tail -n 200 "$BASE_DIR/server.out" >&2 || true
              exit 1
            fi
            echo "[deploy] Health check passed" >> "$LOG"

            warm_paths=("/" "/en/" "/fr/" "/de/" "/es/" "/pt/")
            for path in "${warm_paths[@]}"; do
              echo "[deploy] Warmup ${path}" >> "$LOG"
              curl -fsS "http://127.0.0.1:$PORT_VAL${path}" >/dev/null 2>&1 || true
            done

            echo "[deploy] Done $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$LOG"
          '
