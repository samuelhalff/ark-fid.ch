name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          BUILD_SOURCEMAPS: "false"
        run: npm run build

      - name: Prepare artifact
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        run: tar -czf next-standalone.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          compression-level: 0
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      USER: ${{ secrets.DEPLOY_SSH_USER }}
      PASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
      PORT: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
      BASE_DIR: /srv/customer/sites/ark-fid.ch
      SITE: https://ark-fid.ch
    steps:
      - name: Checkout repo (for scripts if needed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: ./artifact

      - name: Prepare partial artifact
        run: cp artifact/next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Upload release to server (rsync over password SSH)
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y sshpass rsync
          sshpass -p "$PASS" rsync -av --partial --inplace \
            -e "ssh -o StrictHostKeyChecking=no -p $PORT" \
            artifact/next-standalone.tar.gz.part \
            "$USER@$HOST:$BASE_DIR/artifact/"

      - name: Extract, symlink and cleanup on server
        run: |
          set -e
          sudo apt-get install -y sshpass
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" bash -lc '
            set -eE -o pipefail
            BASE_DIR="'"$BASE_DIR"'"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz"
            PART="$BASE_DIR/artifact/next-standalone.tar.gz.part"
            TS=$(date +%Y%m%d%H%M%S)
            REL_DIR="$RELEASES_DIR/$TS"
            TMP="/tmp/ark-fid-release-$TS"
            LOG="$BASE_DIR/deploy.extract.log"

            mkdir -p "$RELEASES_DIR" "$TMP" "$BASE_DIR/artifact"
            [ -f "$PART" ] && mv -f "$PART" "$ARTIFACT"

            cp -f "$ARTIFACT" "$TMP/artifact.tar.gz"
            gzip -cd "$TMP/artifact.tar.gz" > "$TMP/.payload.tar"
            tar -xf "$TMP/.payload.tar" --no-same-owner --no-same-permissions -C "$TMP"
            rm -f "$TMP/.payload.tar"

            # Validate required files
            for f in server.js .next/BUILD_ID .next/static; do
              if [ ! -e "$TMP/$f" ]; then
                echo "[deploy] Missing $f" >> "$LOG"; exit 1
              fi
            done

            # Move into releases and switch symlink
            (mv "$TMP" "$REL_DIR") 2>/dev/null || { mkdir -p "$REL_DIR"; cp -a "$TMP"/. "$REL_DIR"/; rm -rf "$TMP"; }
            ln -sfn "$REL_DIR" "$CURRENT_LINK"
            echo "$TS" > "$BASE_DIR/last_release_ts"
            echo "[deploy] Release $TS ready" >> "$LOG"

            # Cleanup (keep newest 4)
            KEEP=4
            cd "$RELEASES_DIR" 2>/dev/null || exit 0
            ls -1t | tail -n +$((KEEP+1)) | while read -r old; do
              [ -n "$old" ] && [ "$old" != "$TS" ] && rm -rf "$RELEASES_DIR/$old" || true
            done
          '

      # Restart via API (outside SSH so a process exit doesn't kill our session)
      - name: Restart app via API
        env:
          RESTART_TOKEN: ${{ secrets.RESTART_SECRET_TOKEN }}
        run: |
          set -e
          echo "[deploy] Calling /api/restart..."
          curl -fsS -X POST \
            -H "Authorization: Bearer $RESTART_TOKEN" \
            -H "Content-Type: application/json" \
            "$SITE/api/restart" || true
          # Give the orchestrator time to recycle the process
          sleep 20

      - name: Health check
        run: |
          set -e
          sudo apt-get install -y curl
          ATTEMPTS=40; SLEEP=3; OK=0
          for i in $(seq 1 $ATTEMPTS); do
            CODE=$(curl -o /dev/null -s -w "%{http_code}" "$SITE/") || true
            if [ "$CODE" = "200" ]; then
              echo "✅ Health OK (HTTP $CODE)"
              OK=1; break
            fi
            echo "Waiting for server... ($i/$ATTEMPTS, HTTP $CODE)"
            sleep $SLEEP
          done
          [ "$OK" -eq 1 ] || { echo "❌ Health check failed"; exit 1; }

      - name: Warm up pages (root + languages + sitemap URLs)
        run: |
          set -e
          sudo apt-get install -y curl
          echo "[deploy] Warming fixed pages..."
          for p in "/" "/en/" "/fr/" "/de/" "/es/" "/pt/"; do
            curl -fsS "$SITE$p" -o /dev/null || true
          done

          echo "[deploy] Warming pages from sitemap.xml (up to 200, parallel)..."
          TMP=$(mktemp)
          if curl -fsS "$SITE/sitemap.xml" -o "$TMP"; then
            # Extract <loc> URLs and warm in parallel (10 at a time)
            sed -n "s:.*<loc>\\(.*\\)</loc>.*:\\1:p" "$TMP" | head -n 200 | \
              xargs -n 1 -P 10 -I {} bash -lc "curl -fsS '{}' -o /dev/null || true"
          else
            echo "[deploy] No sitemap.xml found (skipping dynamic warmup)"
          fi
