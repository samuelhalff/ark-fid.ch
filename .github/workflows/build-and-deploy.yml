name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    outputs:
      only_translations: ${{ steps.detect.outputs.only_translations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Need full history for diff against previous commit
          fetch-depth: 2

      - name: Detect changed files
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "only_translations=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "only_translations=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ONLY_TRANSLATIONS=true
          for f in $CHANGED; do
            case "$f" in
              src/translations/*) ;;
              *)
                ONLY_TRANSLATIONS=false
                break
                ;;
            esac
          done
          echo "only_translations=$ONLY_TRANSLATIONS" >> "$GITHUB_OUTPUT"
          if [ "$ONLY_TRANSLATIONS" = "true" ]; then
            echo "→ Only translations changed — skipping full build"
          fi

      - name: Setup Node.js 20
        if: steps.detect.outputs.only_translations != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        if: steps.detect.outputs.only_translations != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: TypeScript type check
        if: steps.detect.outputs.only_translations != 'true'
        run: npm run typecheck

      - name: Check malformed internal markdown links (blocking)
        if: steps.detect.outputs.only_translations != 'true'
        run: node scripts/fix-article-internal-links.js --check

      - name: Validate Turnstile config
        if: steps.detect.outputs.only_translations != 'true'
        run: |
          if [ -z "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}" ]; then
            echo "Missing NEXT_PUBLIC_TURNSTILE_SITE_KEY in GitHub Secrets"
            exit 1
          fi

      - name: Restore Next.js build cache
        if: steps.detect.outputs.only_translations != 'true'
        uses: actions/cache@v5
        with:
          path: .next/cache
          # Only invalidate cache on config/dep changes — .next/cache tracks module-level changes internally
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('next.config.js', 'tsconfig.json') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: Build
        if: steps.detect.outputs.only_translations != 'true'
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build

      - name: Prepare artifact
        if: steps.detect.outputs.only_translations != 'true'
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        if: steps.detect.outputs.only_translations != 'true'
        run: tar -czf next-standalone.tar.gz -C dist .

      - name: Upload artifact
        if: steps.detect.outputs.only_translations != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y sshpass curl unzip

      # ─── Translation-only path: rsync JSONs + restart ───
      - name: Rsync translations (only if no code changed)
        if: needs.build.outputs.only_translations == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER: ${{ secrets.DEPLOY_SSH_USER }}
          PASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          PORT="${PORT:-22}"
          sshpass -p "$PASS" rsync -av \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -p $PORT" \
            src/translations/ \
            "$USER@$HOST:/srv/customer/sites/ark-fid.ch/current/src/translations/"

      # ─── Full deploy path: artifact → server ───
      - name: Download artifact (full deploy)
        if: needs.build.outputs.only_translations != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          ARTIFACT_ID=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(a["id"] for a in data["artifacts"] if a["name"] == "next-standalone"))')
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          unzip -q artifact.zip -d artifact

      - name: Prepare partial artifact (full deploy)
        if: needs.build.outputs.only_translations != 'true'
        run: cp artifact/next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Upload release to server (full deploy)
        if: needs.build.outputs.only_translations != 'true'
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22

          sshpass -p "$PASS" rsync -av \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -p $PORT" \
            artifact/next-standalone.tar.gz.part \
            "$USER@$HOST:/srv/customer/sites/ark-fid.ch/artifact/"

      - name: Sync shared env (secrets -> prod)
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          AZURE_AGENT_CHAT_NAME: ${{ secrets.AZURE_AGENT_CHAT_NAME }}
          AZURE_AGENT_ENDPOINT: ${{ secrets.AZURE_AGENT_ENDPOINT }}
          AZURE_AGENT_API_KEY: ${{ secrets.AZURE_AGENT_API_KEY }}
          AZURE_AGENT_CHAT_RESPONSES_API_VERSION: ${{ secrets.AZURE_AGENT_CHAT_RESPONSES_API_VERSION }}
          AZURE_AGENT_RESPONSES_API_VERSION: ${{ secrets.AZURE_AGENT_RESPONSES_API_VERSION }}
          MSGRAPH_TENANT_ID: ${{ secrets.MSGRAPH_TENANT_ID }}
          MSGRAPH_CLIENT_ID: ${{ secrets.MSGRAPH_CLIENT_ID }}
          MSGRAPH_CLIENT_SECRET: ${{ secrets.MSGRAPH_CLIENT_SECRET }}
          SP_SITE_HOSTNAME: ${{ secrets.SP_SITE_HOSTNAME }}
          SP_SITE_PATH: ${{ secrets.SP_SITE_PATH }}
          SP_LEADS_LIST_NAME: ${{ secrets.SP_LEADS_LIST_NAME }}
          SP_LEADS_FIELD_TITLE: ${{ secrets.SP_LEADS_FIELD_TITLE }}
          SP_LEADS_FIELD_EMAIL: ${{ secrets.SP_LEADS_FIELD_EMAIL }}
          SP_LEADS_FIELD_TOKEN_HASH: ${{ secrets.SP_LEADS_FIELD_TOKEN_HASH }}
          SP_LEADS_FIELD_TRANSCRIPT: ${{ secrets.SP_LEADS_FIELD_TRANSCRIPT }}
          SP_LEADS_FIELD_NAME: ${{ secrets.SP_LEADS_FIELD_NAME }}
          SP_LEADS_FIELD_COMPANY: ${{ secrets.SP_LEADS_FIELD_COMPANY }}
          SP_LEADS_FIELD_PHONE: ${{ secrets.SP_LEADS_FIELD_PHONE }}
          SP_LEADS_FIELD_STATUS: ${{ secrets.SP_LEADS_FIELD_STATUS }}
          SP_LEADS_FIELD_SOURCE: ${{ secrets.SP_LEADS_FIELD_SOURCE }}
          SP_LEADS_FIELD_SESSION_ID: ${{ secrets.SP_LEADS_FIELD_SESSION_ID }}
          SP_LEADS_FIELD_PAGE_URL: ${{ secrets.SP_LEADS_FIELD_PAGE_URL }}
          SP_LEADS_FIELD_REFERRER: ${{ secrets.SP_LEADS_FIELD_REFERRER }}
          SP_LEADS_FIELD_UTM_SOURCE: ${{ secrets.SP_LEADS_FIELD_UTM_SOURCE }}
          SP_LEADS_FIELD_UTM_MEDIUM: ${{ secrets.SP_LEADS_FIELD_UTM_MEDIUM }}
          SP_LEADS_FIELD_UTM_CAMPAIGN: ${{ secrets.SP_LEADS_FIELD_UTM_CAMPAIGN }}
          SP_LEADS_FIELD_UTM_TERM: ${{ secrets.SP_LEADS_FIELD_UTM_TERM }}
          SP_LEADS_FIELD_UTM_CONTENT: ${{ secrets.SP_LEADS_FIELD_UTM_CONTENT }}
          SP_LEADS_FIELD_LAST_MESSAGE_AT: ${{ secrets.SP_LEADS_FIELD_LAST_MESSAGE_AT }}
          SP_LEADS_FIELD_LAST_USER_MESSAGE: ${{ secrets.SP_LEADS_FIELD_LAST_USER_MESSAGE }}
          SP_LEADS_FIELD_LAST_ASSISTANT_MESSAGE: ${{ secrets.SP_LEADS_FIELD_LAST_ASSISTANT_MESSAGE }}
          SP_LEADS_FIELD_INITIAL_MESSAGE: ${{ secrets.SP_LEADS_FIELD_INITIAL_MESSAGE }}
          AGENT_LEAD_TOKEN_SECRET: ${{ secrets.AGENT_LEAD_TOKEN_SECRET }}
          FORMSPARK_ACTION_URL: ${{ secrets.FORMSPARK_ACTION_URL }}
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22

          ENV_SYNC_B64=$(python - <<'PY'
          import os, base64
          keys = [
            "NEXT_PUBLIC_TURNSTILE_SITE_KEY",
            "TURNSTILE_SECRET_KEY",
            "AZURE_AGENT_CHAT_NAME",
            "AZURE_AGENT_ENDPOINT",
            "AZURE_AGENT_API_KEY",
            "AZURE_AGENT_CHAT_RESPONSES_API_VERSION",
            "AZURE_AGENT_RESPONSES_API_VERSION",
            "MSGRAPH_TENANT_ID",
            "MSGRAPH_CLIENT_ID",
            "MSGRAPH_CLIENT_SECRET",
            "SP_SITE_HOSTNAME",
            "SP_SITE_PATH",
            "SP_LEADS_LIST_NAME",
            "SP_LEADS_FIELD_TITLE",
            "SP_LEADS_FIELD_EMAIL",
            "SP_LEADS_FIELD_TOKEN_HASH",
            "SP_LEADS_FIELD_TRANSCRIPT",
            "SP_LEADS_FIELD_NAME",
            "SP_LEADS_FIELD_COMPANY",
            "SP_LEADS_FIELD_PHONE",
            "SP_LEADS_FIELD_STATUS",
            "SP_LEADS_FIELD_SOURCE",
            "SP_LEADS_FIELD_SESSION_ID",
            "SP_LEADS_FIELD_PAGE_URL",
            "SP_LEADS_FIELD_REFERRER",
            "SP_LEADS_FIELD_UTM_SOURCE",
            "SP_LEADS_FIELD_UTM_MEDIUM",
            "SP_LEADS_FIELD_UTM_CAMPAIGN",
            "SP_LEADS_FIELD_UTM_TERM",
            "SP_LEADS_FIELD_UTM_CONTENT",
            "SP_LEADS_FIELD_LAST_MESSAGE_AT",
            "SP_LEADS_FIELD_LAST_USER_MESSAGE",
            "SP_LEADS_FIELD_LAST_ASSISTANT_MESSAGE",
            "SP_LEADS_FIELD_INITIAL_MESSAGE",
            "AGENT_LEAD_TOKEN_SECRET",
            "FORMSPARK_ACTION_URL",
          ]
          lines = []
          for key in keys:
            value = os.environ.get(key, "")
            if value:
              lines.append(f"{key}={value}")
          payload = "\n".join(lines).encode()
          print(base64.b64encode(payload).decode())
          PY
          )

          if [ -z "$ENV_SYNC_B64" ]; then
            echo "[deploy] No env values to sync."
            exit 0
          fi

          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -p "$PORT" "$USER@$HOST" bash -lc '
            set -euo pipefail
            ENV_FILE="/srv/customer/sites/ark-fid.ch/shared/.env"
            TMP_FILE="/tmp/arkfid_env_sync"
            printf "%s" "'"$ENV_SYNC_B64"'" | base64 -d > "$TMP_FILE"
            touch "$ENV_FILE"
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              key=${line%%=*}
              val=${line#*=}
              esc=$(printf "%s" "$val" | sed -e "s/[\\\\&|]/\\\\\\\\&/g")
              if grep -q "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${esc}|" "$ENV_FILE"
              else
                printf "%s\n" "${key}=${val}" >> "$ENV_FILE"
              fi
            done < "$TMP_FILE"
            rm -f "$TMP_FILE"
          '

      # ─── Extract, symlink and cleanup (full deploy only) ───
      - name: Extract, symlink and cleanup releases
        if: needs.build.outputs.only_translations != 'true'
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22

          echo "[deploy] Testing SSH connectivity to $HOST:$PORT as $USER"
          if sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -o ConnectTimeout=10 -p "$PORT" "$USER@$HOST" 'echo "SSH probe successful"' 2>/dev/null; then
            echo "[deploy] SSH probe successful"
          else
            echo "[deploy] SSH probe failed (this is normal for some server configurations); proceeding with deployment"
          fi

          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$USER@$HOST" bash -lc '
            set -euo pipefail
            BASE_DIR="/srv/customer/sites/ark-fid.ch"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz"
            PART="$BASE_DIR/artifact/next-standalone.tar.gz.part"
            TS=$(date +%Y%m%d%H%M%S)
            REL_DIR="$RELEASES_DIR/$TS"
            TMP="/tmp/ark-fid-release-$TS"
            LOG="$BASE_DIR/deploy.extract.log"

            echo "[deploy] Starting deployment at $(date)" >> "$LOG"
            echo "[deploy] Release timestamp: $TS" >> "$LOG"
            echo "[deploy] Target directory: $REL_DIR" >> "$LOG"

            mkdir -p "$RELEASES_DIR" "$TMP"
            echo "[deploy] Created directories" >> "$LOG"

            [ -f "$PART" ] && mv "$PART" "$ARTIFACT" && echo "[deploy] Moved partial artifact to final location" >> "$LOG"
            cp "$ARTIFACT" "$TMP/artifact.tar.gz"
            echo "[deploy] Copied artifact to temp directory" >> "$LOG"

            echo "[deploy] Extracting artifact..." >> "$LOG"
            gzip -cd "$TMP/artifact.tar.gz" > "$TMP/.payload.tar"
            tar -xf "$TMP/.payload.tar" --no-same-owner --no-same-permissions -C "$TMP"
            rm -f "$TMP/.payload.tar"
            echo "[deploy] Artifact extracted successfully" >> "$LOG"

            for f in server.js .next/BUILD_ID .next/static; do
              [ -e "$TMP/$f" ] || { echo "[deploy] ERROR: Missing required file: $f" >> "$LOG"; exit 1; }
            done
            echo "[deploy] All required files present" >> "$LOG"

            mv "$TMP" "$REL_DIR" || { cp -r "$TMP"/* "$REL_DIR"/ && rm -rf "$TMP"; }
            echo "[deploy] Moved to releases directory: $REL_DIR" >> "$LOG"

            mkdir -p "$BASE_DIR/shared"
            if [ -f "$BASE_DIR/shared/.env" ]; then
              ln -sfn "$BASE_DIR/shared/.env" "$REL_DIR/.env"
              echo "[deploy] Linked .env file" >> "$LOG"
            fi

            ln -sfn "$REL_DIR" "$CURRENT_LINK"
            echo "$TS" > "$BASE_DIR/last_release_ts"
            echo "[deploy] Updated current symlink to $REL_DIR" >> "$LOG"
            echo "[deploy] Release $TS deployed successfully at $(date)" >> "$LOG"

            KEEP=4
            cd "$RELEASES_DIR" || exit 0
            ls -1t | tail -n +$((KEEP+1)) | while read -r rel; do
              [ -d "$rel" ] && [ "$rel" != "$TS" ] && rm -rf "$RELEASES_DIR/$rel" && echo "[deploy] Cleaned up old release: $rel" >> "$LOG"
            done
            echo "[deploy] Cleanup completed, keeping last $KEEP releases" >> "$LOG"
          '

      # ─── Restart server (always runs) ───
      - name: Restart Node.js server
        timeout-minutes: 3
        run: |
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT }}"; [ -z "$PORT" ] && PORT=22
          TOKEN="${{ secrets.RESTART_SECRET_TOKEN }}"

          echo "[restart] Killing old process..."
          curl --connect-timeout 5 --max-time 20 -X POST "https://ark-fid.ch/api/kill/" -H "Authorization: Bearer $TOKEN" -s -o /dev/null -w "[restart] Kill request status: %{http_code}\n" || echo "[restart] Kill request failed or no process to kill"

          echo "[restart] Waiting for process to terminate..."
          sleep 30

          echo "[restart] Starting new process..."
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$USER@$HOST" '
            set -e
            nohup bash -lc "while true; do cd /srv/customer/sites/ark-fid.ch/current && node server.js >> server.out 2>&1; echo \"Node crashed, restarting...\" >> server.out; sleep 1; done" >/dev/null 2>&1 </dev/null &
          ' || echo "[restart] SSH command completed"

          sleep 30

      # ─── Health check (always runs) ───
      - name: Health check and warmup
        timeout-minutes: 5
        run: |
          CURL_TIMEOUTS=(--connect-timeout 5 --max-time 8)
          ATTEMPTS=40; SLEEP=3; OK=0
          for i in $(seq 1 $ATTEMPTS); do
            STATUS=$(curl "${CURL_TIMEOUTS[@]}" -o /dev/null -s -w "%{http_code}" -L "https://ark-fid.ch/fr/" || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Health check OK"
              OK=1
              break
            fi
            echo "Waiting for server... ($i/$ATTEMPTS, got $STATUS)"
            sleep $SLEEP
          done
          [ "$OK" -eq 1 ] || { echo "❌ Health check failed"; exit 1; }

          echo "[deploy] Warming up paths..."
          for path in "/" "/en/" "/fr/" "/de/" "/es/" "/pt/"; do
            curl "${CURL_TIMEOUTS[@]}" -fsSL "https://ark-fid.ch$path" >/dev/null 2>&1 || true
          done

          echo "[deploy] Warmup next/image cache from locale home pages (non-blocking)"
          TMP=$(mktemp)
          collect_images() {
            echo "$1" | grep -Eo '/_next/image/\?url=[^" ]+' | sed 's/&amp;/\&/g' >> "$TMP"
          }
          BASE_PATHS=("/" "/en/" "/fr/" "/de/" "/es/" "/pt/")
          for path in "${BASE_PATHS[@]}"; do
            HTML=$(curl "${CURL_TIMEOUTS[@]}" -fsSL "https://ark-fid.ch$path" || true)
            collect_images "$HTML"
          done
          sort -u "$TMP" | head -n 40 > "$TMP.list"
          warm_images() {
            local accept="$1"
            while read -r u; do
              curl "${CURL_TIMEOUTS[@]}" -fsSL -H "Accept: $accept" "https://ark-fid.ch$u" >/dev/null 2>&1 || true
            done < "$TMP.list"
          }
          warm_images "image/webp,*/*"
          rm -f "$TMP.list"
          rm -f "$TMP"

          echo "[deploy] Deployment completed successfully"

      - name: Validate live sitemap (non-blocking)
        continue-on-error: true
        run: |
          echo "Checking sitemap format..."
          curl --connect-timeout 5 --max-time 20 -s "https://ark-fid.ch/sitemap.xml" | head -50
          if curl --connect-timeout 5 --max-time 20 -s "https://ark-fid.ch/sitemap.xml" | grep -m 1 -E '<loc>https://[^<]+/</loc>'; then
            echo "✅ Sitemap URLs have trailing slashes"
          else
            echo "Notice: Sitemap URLs may be missing trailing slashes"
          fi