name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=2048
          BUILD_SOURCEMAPS: 'false'
        run: npm run build

      - name: Prepare artifact
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        run: |
          tar -czf next-standalone.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          compression-level: 0
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: ./artifact

      - name: Prepare partial artifact name (.part)
        run: cp artifact/next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Ensure remote target directories
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 90s
          use_insecure_cipher: true
          script: |
            mkdir -p "/srv/customer/sites/ark-fid.ch/artifact" "/srv/customer/sites/ark-fid.ch/releases" "/srv/customer/sites/ark-fid.ch/shared"

      - name: Upload release to server (rsync)
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.DEPLOY_SSH_PASSWORD }}" rsync -avz --partial -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_SSH_PORT || 22 }}" artifact/next-standalone.tar.gz.part ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/srv/customer/sites/ark-fid.ch/artifact/

      - name: Deploy on server (safe extract, atomic switch, restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 90s
          use_insecure_cipher: true
          script_stop: true
          script: |
            if command -v bash >/dev/null 2>&1; then SHELL_EXEC="bash -lc"; else SHELL_EXEC="sh -lc"; fi
            $SHELL_EXEC '
            set -Eeuo pipefail
            echo "[deploy] Start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            BASE_DIR="/srv/customer/sites/ark-fid.ch"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            PID_FILE="$BASE_DIR/ark-fid.pid"
            ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz"
            PART_ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz.part"
            TS=$(date +%Y%m%d%H%M%S)
            REL_DIR="$RELEASES_DIR/$TS"
            TMP_DIR="${REL_DIR}.tmp"

            echo "[deploy] Disk:"
            df -h "$BASE_DIR" || true

            if [ -f "$PART_ARTIFACT" ]; then
            echo "[deploy] Finalize uploaded artifact (.part -> .tar.gz)"
            mv "$PART_ARTIFACT" "$ARTIFACT"
            fi

            echo "[deploy] Artifact:"
            ls -lh "$ARTIFACT"

            echo "[deploy] Wait for artifact to be stable"
            if ! wait_stable "$ARTIFACT"; then
              echo "[deploy] Artifact not stable or missing: $ARTIFACT" >&2
              exit 1
            fi

            echo "[deploy] Extract to temp: $TMP_DIR"
            rm -rf "$TMP_DIR"
            mkdir -p "$TMP_DIR"

            extract_once() {
              gzip -cd "$ARTIFACT" | tar -x --no-same-owner --no-same-permissions -C "$TMP_DIR"
            }

            n=0
            until extract_once; do
              n=$((n+1))
              if [ "$n" -ge 2 ]; then
                echo "[deploy] Extraction failed after $n tries" >&2
                rm -rf "$TMP_DIR"
                exit 1
              fi
              echo "[deploy] Retry extraction..."
              rm -rf "$TMP_DIR"; mkdir -p "$TMP_DIR"; sleep 2
            done

            echo "[deploy] Validate extracted contents"
            for f in server.js .next/BUILD_ID .next/static; do
              if [ ! -e "$TMP_DIR/$f" ]; then
                echo "[deploy] Missing required: $f" >&2
                rm -rf "$TMP_DIR"
                exit 1
              fi
            done

            echo "[deploy] Activate: $REL_DIR"
            mv "$TMP_DIR" "$REL_DIR"

            echo "[deploy] Link shared env (if any)"
            [ -f "$BASE_DIR/shared/.env" ] && ln -sfn "$BASE_DIR/shared/.env" "$REL_DIR/.env"
            [ -f "$BASE_DIR/shared/.env.production" ] && ln -sfn "$BASE_DIR/shared/.env.production" "$REL_DIR/.env.production"

            echo "[deploy] Switch current"
            ln -sfn "$REL_DIR" "$CURRENT_LINK"

            echo "[deploy] Restart"
            cd "$CURRENT_LINK"
            if [ -f "$PID_FILE" ]; then
              OLD_PID="$(cat "$PID_FILE" || true)"
              if [ -n "${OLD_PID:-}" ] && kill -0 "$OLD_PID" >/dev/null 2>&1; then
                kill "$OLD_PID" || true
                sleep 1
              fi
            fi
            PORT_VAL="${PORT_VAL:-${{ secrets.DEPLOY_PORT }}}"
            [ -z "${PORT_VAL:-}" ] && PORT_VAL=3000
            nohup env PORT="$PORT_VAL" node server.js > "$BASE_DIR/server.out" 2>&1 & echo $! > "$PID_FILE"
            echo "[deploy] PID $(cat "$PID_FILE")"

            # Keep only the 4 most recent releases
            releases=$(ls -1 "$RELEASES_DIR" 2>/dev/null | sort)
            count=$(echo "$releases" | wc -l | tr -d " ")
            keep=4
            if [ "$count" -gt "$keep" ]; then
              to_delete=$((count - keep))
              echo "$releases" | head -n "$to_delete" | while IFS= read -r d; do
                [ -n "$d" ] && rm -rf "$RELEASES_DIR/$d" || true
              done
            fi

            # Health check
            ATTEMPTS=60; SLEEP=3; OK=0
            for i in $(seq 1 $ATTEMPTS); do
              echo "[health] Attempt $i/$ATTEMPTS at $(date -u +%H:%M:%S)"
              if curl -fsS "http://127.0.0.1:$PORT_VAL/" >/dev/null 2>&1; then OK=1; break; fi
              sleep $SLEEP
            done
            if [ "$OK" -ne 1 ]; then
              echo "[health] Service did not become healthy in time" >&2
              echo "[health] Last 200 log lines:" >&2
              tail -n 200 "$BASE_DIR/server.out" >&2 || true
              exit 1
            fi
            echo "[deploy] Done $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            '
