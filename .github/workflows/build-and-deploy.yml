name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Debug trigger info
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event type: ${{ github.event.action }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          BUILD_SOURCEMAPS: "false"
        run: npm run build

      - name: Prepare artifact
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        run: tar -czf next-standalone.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          compression-level: 0
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: ./artifact

      - name: Prepare partial artifact
        run: cp artifact/next-standalone.tar.gz artifact/next-standalone.tar.gz.part

      - name: Upload release to server (rsync)
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.DEPLOY_SSH_PASSWORD }}" rsync -av \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_SSH_PORT || 22 }}" \
            artifact/next-standalone.tar.gz.part \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/srv/customer/sites/ark-fid.ch/artifact/

      - name: Ensure remote target directories
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 90s
          use_insecure_cipher: true
          script: |
            mkdir -p "/srv/customer/sites/ark-fid.ch/artifact" \
                     "/srv/customer/sites/ark-fid.ch/releases" \
                     "/srv/customer/sites/ark-fid.ch/shared"

      # --- Extract & Symlink (with cleanup) ---
      - name: Remote extract, symlink and cleanup
        run: |
          set -euo pipefail
          sudo apt-get install -y sshpass
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT || 22 }}"
          sshpass -p "${PASS}" ssh -p "${PORT}" -o StrictHostKeyChecking=no "${USER}@${HOST}" bash -lc '
            set -euo pipefail
            BASE_DIR="/srv/customer/sites/ark-fid.ch"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            ARTIFACT="$BASE_DIR/artifact/next-standalone.tar.gz"
            PART="$BASE_DIR/artifact/next-standalone.tar.gz.part"
            TS=$(date +%Y%m%d%H%M%S)
            REL_DIR="$RELEASES_DIR/$TS"
            TMP="/tmp/ark-fid-release-$TS"
            LOG="$BASE_DIR/deploy.extract.log"

            mkdir -p "$RELEASES_DIR" "$TMP"

            [ -f "$PART" ] && mv "$PART" "$ARTIFACT"
            cp "$ARTIFACT" "$TMP/artifact.tar.gz"

            gzip -cd "$TMP/artifact.tar.gz" > "$TMP/.payload.tar"
            tar -xf "$TMP/.payload.tar" --no-same-owner --no-same-permissions -C "$TMP"
            rm -f "$TMP/.payload.tar"

            for f in server.js .next/BUILD_ID .next/static; do
              [ -e "$TMP/$f" ] || { echo "[deploy] Missing required: $f" >> "$LOG"; exit 1; }
            done

            mv "$TMP" "$REL_DIR" || { cp -r "$TMP"/* "$REL_DIR"/ && rm -rf "$TMP"; }
            ln -sfn "$REL_DIR" "$CURRENT_LINK"

            echo "$TS" > "$BASE_DIR/last_release_ts"

            # --- Cleanup old releases (keep 4) ---
            KEEP=4
            cd "$RELEASES_DIR" || exit 0
            releases=$(ls -1t | tail -n +$((KEEP+1)) || true)
            for rel in $releases; do
              echo "[cleanup] Removing old release: $rel" >> "$LOG"
              rm -rf "$RELEASES_DIR/$rel"
            done
          '

      # --- Kill old process and start new one ---
      - name: Deploy via kill and restart
        run: |
          set -euo pipefail
          sudo apt-get install -y sshpass curl
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT || 22 }}"
          RESTART_TOKEN="${{ secrets.RESTART_SECRET_TOKEN }}"

          echo "[deploy] Restarting application..."

          # Pass RESTART_TOKEN as environment variable to SSH session
          sshpass -p "${PASS}" ssh -p "${PORT}" -o StrictHostKeyChecking=no "${USER}@${HOST}" \
            "RESTART_TOKEN='${RESTART_TOKEN}' bash -c '
            set -euo pipefail
            BASE_DIR=\"/srv/customer/sites/ark-fid.ch\"
            CURRENT_DIR=\"\$BASE_DIR/current\"
            PID_FILE=\"\$BASE_DIR/ark-fid.pid\"
            LOG_FILE=\"\$BASE_DIR/server.out\"
            PORT_VAL=3000
            
            echo \"[1/4] Killing old process via /api/restart endpoint...\"
            if curl -sL -X POST \
              -H \"Authorization: Bearer \${RESTART_TOKEN}\" \
              -H \"Content-Type: application/json\" \
              --max-time 5 \
              \"https://ark-fid.ch/api/restart\" > /dev/null 2>&1; then
              echo \"   ✅ Kill signal sent via API\"
              sleep 3
            else
              echo \"   ⚠️  API kill failed, trying direct kill...\"
              if [ -f \"\$PID_FILE\" ]; then
                OLD_PID=\$(cat \"\$PID_FILE\")
                kill \"\$OLD_PID\" 2>/dev/null || true
                sleep 2
              fi
            fi
            
            echo \"[2/4] Starting new process from current symlink...\"
            cd \"\$CURRENT_DIR\"
            PORT=\$PORT_VAL nohup node server.js > \"\$LOG_FILE\" 2>&1 &
            NEW_PID=\$!
            echo \$NEW_PID > \"\$PID_FILE\"
            echo \"   Started with PID: \$NEW_PID\"
            
            echo \"[3/4] Waiting for server to be ready...\"
            for i in {1..30}; do
              if curl -fsS \"http://127.0.0.1:\$PORT_VAL/\" > /dev/null 2>&1; then
                echo \"   ✅ Server is responding\"
                break
              fi
              if [ \$i -eq 30 ]; then
                echo \"   ❌ Server failed to start within 30 seconds\"
                tail -50 \"\$LOG_FILE\" || true
                exit 1
              fi
              sleep 1
            done
            
            echo \"[4/4] Deployment complete!\"
          '"

      # --- Health check ---
      - name: Health check and warmup
        run: |
          set -euo pipefail
          sudo apt-get install -y sshpass curl
          HOST="${{ secrets.DEPLOY_SSH_HOST }}"
          USER="${{ secrets.DEPLOY_SSH_USER }}"
          PASS="${{ secrets.DEPLOY_SSH_PASSWORD }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT || 22 }}"
          sshpass -p "${PASS}" ssh -p "${PORT}" -o StrictHostKeyChecking=no "${USER}@${HOST}" bash -lc '
            set -euo pipefail
            BASE_DIR="/srv/customer/sites/ark-fid.ch"
            PORT_VAL="${PORT_VAL:-${{ secrets.DEPLOY_PORT }}}"
            [ -z "$PORT_VAL" ] && PORT_VAL=3000

            ATTEMPTS=60; SLEEP=3; OK=0
            for i in $(seq 1 $ATTEMPTS); do
              if curl -fsS "http://127.0.0.1:$PORT_VAL/" >/dev/null 2>&1; then OK=1; break; fi
              sleep $SLEEP
            done
            [ "$OK" -eq 1 ] || { tail -n 200 "$BASE_DIR/server.out" >&2 || true; exit 1; }

            for path in "/" "/en/" "/fr/" "/de/" "/es/" "/pt/"; do
              curl -fsS "http://127.0.0.1:$PORT_VAL$path" >/dev/null 2>&1 || true
            done
          '
