name: Build and Deploy (SSH)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NODE_OPTIONS: --max_old_space_size=2048
        run: npm run build

      - name: Prepare artifact
        run: bash scripts/prepare-artifact.sh

      - name: Archive artifact
        run: |
          tar -czf next-standalone.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: next-standalone.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: ./artifact

      - name: Ensure remote target directories
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 20m
          use_insecure_cipher: true
          script: |
            mkdir -p "${{ secrets.DEPLOY_TARGET_DIR || '/srv/sites/ark-fid.ch' }}/artifact" "${{ secrets.DEPLOY_TARGET_DIR || '/srv/sites/ark-fid.ch' }}/releases" "${{ secrets.DEPLOY_TARGET_DIR || '/srv/sites/ark-fid.ch' }}/shared"

      # Option A: Use password auth (supported by appleboy actions). Prefer SSH key if possible.
      - name: Upload release to server (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          local_path: "artifact/next-standalone.tar.gz"
          remote_path: ${{ secrets.DEPLOY_TARGET_DIR || '/srv/sites/ark-fid.ch' }}/artifact/
          sftp_only: true
          delete: false
          dry-run: false

      - name: Deploy on server (extract, switch symlink, restart via nohup)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 20m
          use_insecure_cipher: true
          script_stop: true
          script: |
            set -xeo pipefail
            echo "[deploy] Start at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            BASE_DIR="${{ secrets.DEPLOY_TARGET_DIR || '/srv/sites/ark-fid.ch' }}"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            PID_FILE="$BASE_DIR/ark-fid.pid"
            TS=$(date +%Y%m%d%H%M%S)
            REL_DIR="$RELEASES_DIR/$TS"

            echo "[deploy] Prepare release dir: $REL_DIR"
            mkdir -p "$RELEASES_DIR"
            mkdir -p "$REL_DIR"
            echo "[deploy] Extract artifact"
            ls -lh "$BASE_DIR/artifact/next-standalone.tar.gz" || true
            # Extract in subshell; treat exit 0 and 141 as success for drone-ssh
            (
              set +e
              tar -xzf "$BASE_DIR/artifact/next-standalone.tar.gz" --no-same-owner --no-same-permissions -C "$REL_DIR" >/dev/null 2>&1
              TAR_STATUS=$?
              if [ "$TAR_STATUS" -ne 0 ] && [ "$TAR_STATUS" -ne 141 ]; then
                echo "[deploy] tar failed with code $TAR_STATUS" >&2
                exit "$TAR_STATUS"
              fi
            )

            # Extract in a subshell and normalize exit 141 (SIGPIPE) to success for drone-ssh wrapper
            (
              set +e
              tar -xzf "$BASE_DIR/artifact/next-standalone.tar.gz" --no-same-owner --no-same-permissions -C "$REL_DIR" >/dev/null 2>&1
              TAR_STATUS=$?
              if [ "$TAR_STATUS" -ne 0 ] && [ "$TAR_STATUS" -ne 141 ]; then
                echo "[deploy] tar failed with code $TAR_STATUS" >&2
                exit "$TAR_STATUS"
              fi
            )

            # Link shared .env files if present
            echo "[deploy] Link shared env files (if any)"
            if [ -f "$BASE_DIR/shared/.env" ]; then ln -sfn "$BASE_DIR/shared/.env" "$REL_DIR/.env"; fi
            if [ -f "$BASE_DIR/shared/.env.production" ]; then ln -sfn "$BASE_DIR/shared/.env.production" "$REL_DIR/.env.production"; fi

            # Atomically switch current
            echo "[deploy] Switch current symlink"
            ln -sfn "$REL_DIR" "$CURRENT_LINK"

            # Restart via nohup using PID file (no pm2 available)
            cd "$CURRENT_LINK"
            echo "[deploy] Stop previous process if running"
            if [ -f "$PID_FILE" ]; then
              OLD_PID=$(cat "$PID_FILE" || true)
              if [ -n "${OLD_PID:-}" ] && kill -0 "$OLD_PID" >/dev/null 2>&1; then
                kill "$OLD_PID" || true
                sleep 1
              fi
            fi
            PORT_VAL="${{ secrets.DEPLOY_PORT }}"
            if [ -z "${PORT_VAL}" ]; then PORT_VAL=3000; fi
            echo "[deploy] Start server (PORT=$PORT_VAL)"
            nohup env PORT="$PORT_VAL" node server.js > "$BASE_DIR/server.out" 2>&1 & echo $! > "$PID_FILE"
            echo "[deploy] Started with PID $(cat "$PID_FILE")"
            tail -n +1 -F "$BASE_DIR/server.out" &
            TAIL_PID=$!

            # Keep only the 4 most recent releases (POSIX-friendly)
            releases=$(ls -1 "$RELEASES_DIR" 2>/dev/null | sort)
            count=$(printf "%s\n" "$releases" | wc -l | tr -d ' ')
            keep=4
            if [ "$count" -gt "$keep" ]; then
              to_delete=$((count - keep))
              printf "%s\n" "$releases" | head -n "$to_delete" | while IFS= read -r d; do
                [ -n "$d" ] && rm -rf "$RELEASES_DIR/$d" || true
              done
            fi

            # Health check: wait for local port to respond
            ATTEMPTS=60
            SLEEP=3
            OK=0
            for i in $(seq 1 $ATTEMPTS); do
              echo "[health] Attempt $i/$ATTEMPTS at $(date -u +%H:%M:%S)"
              if curl -fsS "http://127.0.0.1:$PORT_VAL/" >/dev/null 2>&1; then
                echo "[health] OK"
                OK=1; break
              fi
              sleep $SLEEP
            done
            kill "$TAIL_PID" >/dev/null 2>&1 || true
            if [ "$OK" -ne 1 ]; then
              echo "[health] Service did not become healthy in time" >&2
              echo "[health] Last 200 log lines:" >&2
              tail -n 200 "$BASE_DIR/server.out" >&2 || true
              exit 1
            fi
            echo "[deploy] Done at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
