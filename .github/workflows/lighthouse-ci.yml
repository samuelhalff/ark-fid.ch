name: Lighthouse CI (local server)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'public/**'
      - 'next.config.js'
      - 'lighthouserc.*.json'

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build (standalone)
        env:
          BUILD_SOURCEMAPS: 'false'
          NODE_OPTIONS: --max_old_space_size=2048
        run: npm run build

      - name: Start local server
        run: |
          nohup env PORT=5000 node .next/standalone/server.js > lhci.server.log 2>&1 & echo $! > lhci.server.pid

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:5000/fr/" >/dev/null 2>&1; then
              echo "Server ready"; exit 0; fi; sleep 2; done
          echo "Server did not start in time"; tail -n 200 lhci.server.log || true; exit 1

      - name: Run Lighthouse (mobile)
        run: npx --yes @lhci/cli collect --config=lighthouserc.mobile.json

      - name: Upload Lighthouse (mobile)
        run: npx --yes @lhci/cli upload --target=temporary-public-storage

      - name: Run Lighthouse (desktop)
        run: npx --yes @lhci/cli collect --config=lighthouserc.desktop.json

      - name: Upload Lighthouse (desktop)
        run: npx --yes @lhci/cli upload --target=temporary-public-storage

      - name: Upload LHCI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lhci-results
          path: .lighthouseci
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: |
          if [ -f lhci.server.pid ]; then kill $(cat lhci.server.pid) || true; fi
          sleep 1
          pgrep -f ".next/standalone/server.js" && pkill -f ".next/standalone/server.js" || true

