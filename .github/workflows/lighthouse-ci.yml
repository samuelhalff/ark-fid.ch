name: Lighthouse CI (local server)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'public/**'
      - 'next.config.js'
      - 'lighthouserc.*.json'

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build (standalone)
        env:
          BUILD_SOURCEMAPS: 'false'
          NODE_OPTIONS: --max_old_space_size=2048
        run: npm run build

      - name: Run Lighthouse (mobile)
        run: npx --yes @lhci/cli collect --config=lighthouserc.mobile.json

      - name: Upload Lighthouse (mobile)
        run: npx --yes @lhci/cli upload --target=temporary-public-storage

      - name: Run Lighthouse (desktop)
        run: npx --yes @lhci/cli collect --config=lighthouserc.desktop.json

      - name: Upload Lighthouse (desktop)
        run: npx --yes @lhci/cli upload --target=temporary-public-storage

      - name: Upload LHCI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lhci-results
          path: .lighthouseci
          if-no-files-found: ignore
