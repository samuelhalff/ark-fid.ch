name: Lighthouse CI

on:
  workflow_dispatch:
    inputs:
      urlBase:
        description: "Base URL to test (default: https://ark-fid.ddns.net)"
        required: false
        default: "https://ark-fid.ddns.net"
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [mobile, desktop]
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Lighthouse (${{ matrix.profile }})
        if: matrix.profile == 'mobile'
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/services/odoo
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/partners
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/ressources
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Run Lighthouse (desktop)
        if: matrix.profile == 'desktop'
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/services/odoo
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/partners
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/ressources
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.desktop.json

      - name: Verify 404 endpoint (status + HTML)
        if: matrix.profile == 'mobile'
        shell: bash
        run: |
          BASE="${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}"
          URL="$BASE/fr/this-page-does-not-exist"
          echo "Checking $URL returns 404 and HTML..."
          STATUS=$(curl -s -o /tmp/lf_404.html -w "%{http_code}" "$URL")
          file /tmp/lf_404.html || true
          if [ "$STATUS" != "404" ]; then
            echo "Expected 404 but got $STATUS" >&2
            head -n 50 /tmp/lf_404.html || true
            exit 1
          fi
          # quick sanity that it's our custom 404 content
          if ! grep -qi "404" /tmp/lf_404.html; then
            echo "404 page did not contain expected marker" >&2
            head -n 50 /tmp/lf_404.html || true
            exit 1
          fi
          echo "404 endpoint verified."

      - name: Summary
        if: always()
        run: |
          echo "Lighthouse (${{ matrix.profile }}) finished. Download HTML/JSON reports from artifacts." >> $GITHUB_STEP_SUMMARY
