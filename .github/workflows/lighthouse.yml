name: Lighthouse CI

on:
  workflow_dispatch:
    inputs:
      urlBase:
        description: "Base URL to test (default: https://ark-fid.ddns.net)"
        required: false
        default: "https://ark-fid.ddns.net"
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [mobile, desktop]
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Lighthouse (${{ matrix.preset }})
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/services/odoo
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/partners
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/ressources
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/this-page-does-not-exist
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ${{ matrix.preset == 'mobile' && './lighthouserc.mobile.json' || './lighthouserc.desktop.json' }}

      - name: Summary
        if: always()
        run: |
          echo "Lighthouse (${{ matrix.preset }}) finished. Download HTML/JSON reports from artifacts." >> $GITHUB_STEP_SUMMARY
