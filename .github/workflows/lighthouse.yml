name: Lighthouse CI

on:
  workflow_dispatch:
    inputs:
      urlBase:
        description: "Base URL to test (default: https://ark-fid.ddns.net)"
        required: false
        default: "https://ark-fid.ddns.net"
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [mobile, desktop]
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Lighthouse (${{ matrix.profile }})
        if: matrix.profile == 'mobile'
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/en/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/services/odoo/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/partners/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/ressources/
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true
          artifactName: lighthouse-${{ matrix.profile }}

      - name: Run Lighthouse (desktop)
        if: matrix.profile == 'desktop'
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/en/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/services/odoo/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/partners/
            ${{ github.event.inputs.urlBase || 'https://ark-fid.ddns.net' }}/fr/ressources/
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.desktop.json
          artifactName: lighthouse-${{ matrix.profile }}

      - name: Summary
        if: always()
        run: |
          echo "Lighthouse (${{ matrix.profile }}) finished. Download HTML/JSON reports from artifacts." >> $GITHUB_STEP_SUMMARY
          node scripts/lh-summary.js .lighthouseci "${{ matrix.profile }}" >> $GITHUB_STEP_SUMMARY || true
