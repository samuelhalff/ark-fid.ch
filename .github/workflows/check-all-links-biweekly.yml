name: Check All Article Links (Twice Monthly)

on:
  schedule:
    - cron: "0 6 1,15 * *" # 1st and 15th of each month at 06:00 UTC (~every 2 weeks)
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate all article references (full check)
        run: npm run validate:article-refs -- --no-fail

      - name: Check all article remote links
        continue-on-error: true
        run: |
          echo "🔗 Checking all remote article reference URLs across all locales..."
          node scripts/check-ressources-links.js --all-locales --remote || echo "::warning::Some URLs unreachable"
          echo "✅ Full link check complete."
