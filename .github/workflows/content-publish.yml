name: Content Publish

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Only validate content (skip deploy)"
        required: false
        default: false
        type: boolean
      sync_translations:
        description: "Sync FR translations to other locales (overwrites)"
        required: false
        default: false
        type: boolean

concurrency:
  group: content-publish
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: List content inventory
        run: node scripts/list-content.js

      - name: Validate translations
        run: npm run validate:translations

      - name: Validate article references (non-blocking)
        continue-on-error: true
        run: npm run validate:article-refs -- --no-fail

      - name: Validate article translations
        run: node scripts/validate-article-translations.js

      - name: Lint metadata
        continue-on-error: true
        run: npm run lint:metadata

      - name: Sync translations (FR → other locales)
        if: ${{ inputs.sync_translations }}
        run: node scripts/sync-ressources.js --apply --force-overwrite

      - name: Commit changes
        if: ${{ !inputs.validate_only }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/translations/ || true
          if git diff --cached --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "chore(content): validate and publish content update"
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed"; git rebase --abort || true; exit 1; }
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 📝 Content Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.validate_only }}" = "true" ]; then
            echo "- ✅ Content validated (dry run, no deploy)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Content validated and changes pushed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Deployment will be triggered by build-and-deploy workflow" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.sync_translations }}" = "true" ]; then
            echo "- ✅ Translations synced from FR to other locales" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Content inventory" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node scripts/list-content.js >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
