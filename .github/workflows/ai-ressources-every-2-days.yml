name: AI Resources Update (every 2 days)

on:
  schedule:
    - cron: "0 0 */2 * *" # every 2 days at 00:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (runtime only)
        run: npm i --omit=dev --ignore-scripts

      - name: Run AI update (FR + translations via Azure Agent)
        env:
          AZURE_AGENT_ENDPOINT: ${{ secrets.AZURE_AGENT_ENDPOINT }}
          AZURE_AGENT_ID: ${{ secrets.AZURE_AGENT_ID }}
          AZURE_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
          AZURE_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          AZURE_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          # Optional: a distinct agent for translation
          AZURE_TRANSLATE_AGENT_ID: ${{ secrets.AZURE_TRANSLATE_AGENT_ID }}
          # Adjust if longer draft generations are needed
          AZURE_AGENT_RUN_TIMEOUT_MS: 180000
        run: |
          node scripts/ai-ressources-update.js --apply

      - name: Verify ressources links (local files only)
        run: |
          node scripts/check-ressources-links.js --all-locales

      - name: Verify ressources remote sources (HTTP)
        run: |
          node scripts/check-ressources-links.js --all-locales --remote

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ressources): every 2 days AI update (1 file + 1 article)"
          file_pattern: |
            src/translations/**/ressources.json
            public/assets/downloads/**

      - name: Ping sitemaps
        run: |
          node scripts/ping-sitemaps.js

      # Build a standalone bundle so it can be deployed to the server
      - name: Install deps for build (with dev)
        run: npm i

      - name: Build CSS artifact (optional)
        run: npm run css:build

      - name: Build Next.js (standalone)
        run: npm run build

      - name: Package standalone bundle
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public 2>/dev/null || true
          # (optional) include .env.production in the bundle if present
          if [ -f .env.production ]; then cp .env.production .next/standalone/.env.production; fi
          tar -czf release.tgz .next/standalone

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release.tgz
          path: release.tgz
          retention-days: 7

      # Optional: Deploy to server via SSH (requires repo secrets)
      - name: Setup SSH agent
        if: ${{ secrets.SSH_HOST && secrets.SSH_USER && secrets.SSH_PRIVATE_KEY }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy bundle to server
        if: ${{ secrets.SSH_HOST && secrets.SSH_USER && secrets.SSH_PRIVATE_KEY }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || 22 }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH || '/srv/sites/ark-fid.ch' }}
        run: |
          scp -P "$SSH_PORT" -o StrictHostKeyChecking=no release.tgz "$SSH_USER@$SSH_HOST:$REMOTE_PATH/release.tgz"

      - name: Deploy on server (extract + restart)
        if: ${{ secrets.SSH_HOST && secrets.SSH_USER && secrets.SSH_PRIVATE_KEY }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || 22 }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH || '/srv/sites/ark-fid.ch' }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'EOSSH'
            set -e
            cd "$REMOTE_PATH"
            rm -rf .next/standalone || true
            tar -xzf release.tgz
            cat > start.sh << 'EOF'
            #!/usr/bin/env bash
            set -e
            cd "$(dirname "$0")"
            if [ -f app.pid ]; then
              if kill -0 "$(cat app.pid)" 2>/dev/null; then
                kill "$(cat app.pid)" || true
                sleep 1
              fi
            fi
            nohup node .next/standalone/server.js > app.log 2>&1 & echo $! > app.pid
            echo "Started: PID $(cat app.pid)"
            EOF
            chmod +x start.sh
            if command -v systemctl >/dev/null 2>&1 && systemctl --user status ark-fid >/dev/null 2>&1; then
              systemctl --user restart ark-fid || true
            elif command -v pm2 >/dev/null 2>&1; then
              pm2 startOrReload ecosystem.config.js || pm2 start "node .next/standalone/server.js" --name ark-fid --update-env || true
            else
              ./start.sh
            fi
          EOSSH
