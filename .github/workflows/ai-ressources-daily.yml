name: Daily Resources Update (AI)

on:
  schedule:
    - cron: "0 4 */2 * *" # every 2 days at 04:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run AI update (FR + translations)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_DRAFT: gemini-1.5-pro
          GEMINI_MODEL_TRANSLATE: gemini-2.0-flash
        run: |
          node scripts/ai-ressources-update.js --apply

      - name: Verify ressources links (local files only)
        run: |
          node scripts/check-ressources-links.js --all-locales

      - name: Verify ressources remote sources (HTTP)
        run: |
          node scripts/check-ressources-links.js --all-locales --remote

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ressources): daily AI update (1 file + 1 article)"
          file_pattern: |
            src/translations/**/ressources.json
            public/assets/downloads/**

      - name: Ping sitemaps
        run: |
          node scripts/ping-sitemaps.js
